l_french:
game_concept_majority_culture: "Culture Majoritaire"
game_concept_majority_cultures: "Cultures Majoritaires"
game_concept_majority_culture_desc: "Parmi les [cultures|E] d'un [county|E], celle comptant le plus d'adhérents est considérée comme la [majority_culture]."
game_concept_minority_culture: "Culture Minoritaire"
game_concept_minority_cultures: "Cultures Minoritaires"
game_concept_minority_culture_desc: "Toutes les cultures [cultures|E] d'un [county|E] qui ne sont pas la [majority_culture|E] sont considérées comme des [minority_cultures]."
game_concept_culture_tension: "Tension Culturelle"
game_concept_culture_tension_desc: "Chaque province est sujette à une tension culturelle qui traduit la dissatisfaction de ses cultures envers le [holder|E] du [county|E].\n\nLa [culture_tension] va progressivement dériver vers la [culture_tension_baseline|E] et sera modifiée par des événements dans la [barony|E] et le comportement de ses [rulers|E] (en comprenant les [lieges|E] du [holder|E]) envers ses [cultures|E]."
game_concept_culture_tension_baseline: "Tension Culturelle de Base"
game_concept_culture_tension_baseline_desc: "Chaque province possède une tension culturelle de base vers laquelle le niveau de [culture_tension|E] va progressivement dériver.\n\nCette valeur de base est déterminée par l'[cultural_acceptance|E] entre les [cultures|E] de la [barony|E] et celle du [holder|E] ainsi que la capacité au [holder|E] du [county|E] à parler leur langage."
game_concept_majority_faith: "Foi Majoritaire"
game_concept_majority_faiths: "Fois Majoritaires"
game_concept_majority_faith_desc: "Parmi les [faiths|E] d'un [county|E], celle en comptant le plus d'adhérents est considérée comme la [majority_faith]."
game_concept_minority_faith: "Foi Minoritaire"
game_concept_minority_faiths: "Fois Minoritaires"
game_concept_minority_faith_desc: "Toutes les cultures [faiths|E] d'un [county|E] qui ne sont pas la [majority_faith|E] sont considérées comme des [minority_faith]."
game_concept_faith_tension: "Tension Religieuse"
game_concept_faith_tension_desc: "Chaque province est sujette à une tension religieuse qui traduit la dissatisfaction de ses cultures envers le [holder|E] du [county|E].\n\nLa [faith_tension] va progressivement dériver vers la [faith_tension_baseline|E] et sera modifiée par des événements dans la [barony|E] et le comportement de ses [rulers|E] (en comprenant les [lieges|E] du [holder|E]) envers ses [faiths|E]."
game_concept_faith_tension_baseline: "Tension Religieuse de Base"
game_concept_faith_tension_baseline_desc: "Chaque province possède une tension culturelle de base vers laquelle le niveau de [culture_tension|E] va progressivement dériver.\n\nCette valeur de base est déterminée par l'[faith_hostility|E], la [fervor|E] ainsi que les [core_tenets|E] et [doctrines|E] des [faiths|E] de la [barony|E] et celle du [holder|E]."
# game_concept_province: "Province"
# game_concept_provinces: "Provinces"
# game_concept_province_desc: "La subdivision d'un [county|E] qui peut accueillir une [holding|E] et ainsi devenir une [barony|E] ou une [county_capital|E]."
game_concept_culture_tolerance_law: "Tolérance Culturelle"
game_concept_culture_tolerance_laws: "Lois de Tolérance Culturelle"
game_concept_culture_tolerance_law_desc: "$game_concept_culture_tolerance_law$ représente l'attitude du $game_concept_realm$ envers les autres [cultures|E] à l'intérieur.\n\nElle affecte :\n$EFFECT_LIST_BULLET$$MOD_DIFFERENT_CULTURE_OPINION$\n$EFFECT_LIST_BULLET$$glory_hound_same_culture_opinion$\n$EFFECT_LIST_BULLET$$minority_different_culture_opinion$\n$EFFECT_LIST_BULLET$[culture_tension_baseline|E] dans le $game_concept_realm$\n$EFFECT_LIST_BULLET$La [councillor_task|E] [promote_culture|E]\n$EFFECT_LIST_BULLET$La [councillor_task|E] [accept_culture|E]"
game_concept_faith_tolerance_law: "Tolérance Religieuse"
game_concept_faith_tolerance_laws: "Lois de Tolérance Religieuse"
game_concept_faith_tolerance_law_desc: "$game_concept_faith_tolerance_law$ représente l'attitude du $game_concept_realm$ envers les autres [faiths|E] à l'intérieur.\n\nElle affecte :\n$EFFECT_LIST_BULLET$$MOD_DIFFERENT_FAITH_OPINION$\n$EFFECT_LIST_BULLET$$MOD_CLERGY_OPINION$\n$EFFECT_LIST_BULLET$$glory_hound_same_faith_opinion$\n$EFFECT_LIST_BULLET$$zealot_same_faith_opinion$\n$EFFECT_LIST_BULLET$$minority_different_faith_opinion$\n$EFFECT_LIST_BULLET$[faith_tension_baseline|E] dans le $game_concept_realm$\n$EFFECT_LIST_BULLET$La [councillor_task|E] [convert_county|E]"
