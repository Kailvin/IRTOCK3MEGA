l_simp_chinese:
 wanggiyan_invasion.1001.t:0 "[invader.GetFirstNameNoTooltip] [invader.GetHouse.GetNameNoTooltip]"
 wanggiyan_invasion.1001.desc:0 "The $jurchen_collective_noun$ were first mentioned in written records of the 10th century as mere tributaries, more recently of $e_liao$. Up until now, they acted as unremarkable tribal people who were not in charge of their own destiny.\n\nTheir overlords must've thought the same about the $jurchen_collective_noun$, as the demanded tribute rose ever higher under an iron thumb. Utilizing widespread discontent, [invader.GetFather.GetFirstNameNoTooltip] gained massive influence over all $jurchen$ tribes.\n\nIn a joint war against $e_liao$, the armies of $e_song$ faltered and showed signs of weakness, while the $jurchen_collective_noun$ stood their ground and drove away $e_liao$.\n\nAn unique opportunity has presented itself to [invader.GetShortUINameNoTooltip]. Will the $jurchen_collective_noun$ remain a footnote in history or finally leave their mark on the world?"
 wanggiyan_invasion.1001.a:0 "Blind, foolish ambition."
 wanggiyan_invasion.1001.b:0 "@warning_icon! I wonder what the future holds for [invader.GetHerHim]..."