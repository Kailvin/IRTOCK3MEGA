 building_kaifeng_palace_02: "坛庙"
 building_kaifeng_palace_02_desc: "国之大事，在祀与戎。天地、日月、社稷、祖先均不可怠慢，须由皇帝亲祭，其余则遣官致祭。"
 building_kaifeng_palace_03: "御苑"
 building_kaifeng_palace_03_desc: "环绕着亭台楼阁与奇花异草的御苑，是天子休憩游赏、修身养性之地。"
 building_kaifeng_palace_04: "明堂"
 building_kaifeng_palace_04_desc: "明堂辟雍曾是皇帝大享祭天，配祀祖宗，朝会诸侯，颁布政令之地，有着极为尊崇的象征意义。"
 building_kaifeng_palace_05: "都城"
 building_kaifeng_palace_05_desc: "京师由内外多重城墙层层环绕，同时被分割为宫城、皇城、内城、外城等多个部分。政令通达的行政中枢坐落于朱垣之内，确保都城乃至天下繁荣昌盛。"
 has_game_rule_uba_history_special_buildings_on: "$rule_uba_history_special_buildings$已启用"

## 紫禁城
