#  building_forbidden_city_01: "外朝"
#  building_forbidden_city_01_desc: "$building_type_forbidden_city_01_desc$\n\n金銮殿是宏伟庄严的帝国礼仪中心，是皇帝举行登基、册封等重大典礼，以及召集文武百官朝贺、颁布政令的核心区域。"
 building_forbidden_city_02: "内廷"
 building_forbidden_city_02_desc: "$building_type_forbidden_city_01_desc$\n\n此地是皇帝生活的私人领域，也是皇帝处理日常政务、读书休养的居所。也是所谓三宫六院，皇帝的后妃们的居所。"
 building_forbidden_city_03: "园林"
 building_forbidden_city_03_desc: "$building_type_forbidden_city_01_desc$\n\n小规模的山水景致点缀于宫城之中，供皇帝游憩赏玩。亭台楼阁、奇花异草无所不有，正是修身养性之地。"
 building_forbidden_city_04: "内务"
 building_forbidden_city_04_desc: "$building_type_forbidden_city_01_desc$\n\n宫城中服务于皇室生活与宫廷运转的配套设施，包括太监、宫女的居所、存放档案、财帛的库房等，保障着整座宫城的日常运作。"
 building_forbidden_city_05: "宫城"
 building_forbidden_city_05_desc: "$building_type_forbidden_city_01_desc$\n\n高耸的城墙、门楼、角楼与护城河构成的坚固防线，周围布置着严密的警卫系统，确保宫城内部的绝对安全。\n\n皇权至高无上，不可侵犯。"

## 君堡大皇宫
 building_type_palatium_magnum_01: "神圣宫殿"
 building_type_palatium_magnum_01_desc: "竞技场东南侧的宫殿群构成了[Glossary( '大皇宫', 'PALATIUM_MAGNUM_GLOSS')]的主体部分，包含了数十座奢华美丽的宫殿。\n\n月桂宫作为皇帝寝宫之外还是宫内重要的礼仪场所；咨议厅是皇帝与元老议事的厅堂；[Glossary( '金宴殿', 'CHRYSOTRIKLINOS_GLOSS')]结合了王座厅与宴会厅的作用，是皇帝上朝议政的场所，它那美丽而独特的八角形令每个访客印象深刻；皇帝的宝座设置在大殿半圆形顶点的圣坛上，这个长长的大殿看上去像教堂，实际也是按照教堂的样式设计的……\n\n因此她将永恒存在。毫无疑问，没有什么能颠覆罗马的强大力量。"
 building_palatium_magnum_01: "君士坦丁堡竞技场"
 building_palatium_magnum_01_desc: "当这座[Glossary( '竞技场', 'HIPPODROME_GLOSS' )]落成的时候，这座城市还只被称作“拜占庭”。这座面积巨大的竞技场出自君士坦丁大帝的规划，场中有着皇帝专用的大理石[Glossary( '御席', 'KATHISMA_GLOSS')]，是皇帝在竞技场喧嚣之上的荣耀坐席，其背后有一条通向月桂宫的捷径。\n\n竞技场北门外，是以黑色大理石铺地的[Glossary( '奥古斯塔广场', 'AUGUSTAION_GLOSS')]，广场的远端矗立着[Glossary( '米利翁里程碑', 'MILION_GLOSS' )]，竞技场前方的两侧则坐落着巨大的宙克西帕斯浴场和圣索菲亚大教堂。\n\n竞技场内，U形的赛马道上奔驰的骏马与战车互相竞争——这些比赛不仅仅是简单的体育活动，它们让皇帝、贵族与平民罕见地拥有了共同话题。"
 building_palatium_magnum_02: "中央宫殿群"
 building_palatium_magnum_02_desc: "宙克西帕斯浴场、安条克宫与劳索斯宫构成了大皇宫北侧的宫殿群。[Glossary( '宙克西帕斯浴场', 'ZEUXIPPUS_GLOSS')]曾是君士坦丁堡最受欢迎的公共浴场，而重建后的大浴场再一次焕发生机。\n\n西侧则是以大量英雄和神话雕像藏品而闻名的[Glossary( '安条克宫', 'PALACE_ANTIOCHOS_GLOSS')]与劳索斯宫——即便在君士坦丁堡，同时存有如此之多宝物的宫殿也是屈指可数的。\n\n而在安条克宫与劳索斯宫北侧，柱廊拱卫的[Glossary( '梅塞大道', 'MESE_GLOSS')]一直通向城市的远方——向西不远，便是圆形的[Glossary( '君士坦丁广场', 'CONSTANTINI_GLOSS')]，它是君士坦丁堡商业和政治活动的第一大中心。"
 building_palatium_magnum_03: "君士坦丁堡大学"
 building_palatium_magnum_03_desc: "玛格瑙拉宫曾是元老院的所在地，而狄奥多西皇帝在公元425年于此创立了[Glossary( '君士坦丁堡大学', 'PANDIDAKTERION_GLOSS' )]，世界上最大的研究中心之一，同时也被学者们普遍认为是世界上第一所大学。而帝国图书馆同样位于玛格瑙拉宫中，据说其中收藏了亚历山大图书馆的遗物。\n\n在经历了数次重修后，这所大学再度开始培养能干且有学识的青年，为帝国提供可用之才。"
 building_palatium_magnum_04: "海岸宫殿群"
 building_palatium_magnum_04_desc: "以[Glossary( '牛狮宫', 'BOUKOLEON_PALACE_GLOSS')]坐落为代表的海岸宫殿群以其宏伟的立面与精美的雕刻品而闻名于世，而更绝妙的是宫殿本身也构成了海岸城墙的一部分。侧边甚至还有一道海闸，可直接通往皇帝专用的港口。\n\n其北则是著名的灯塔塔，侧面的灯塔圣母堂虽然规模很小，但其内部装饰却极尽奢华。位于其间的是更为宏伟的[Glossary( '新教堂', 'NEA_EKKLESIA_GLOSS' )]与由皇帝狄奥菲洛兴建的三叶堂。而新教会与海岸城墙之间的空地则是马上曲棍球的场地。"
 building_palatium_magnum_05: "君士坦丁堡大皇宫"
 building_palatium_magnum_05_desc: "$building_type_palatium_magnum_01_desc$"

 PALATIUM_MAGNUM_GLOSS: "君士坦丁堡大皇宫是公元330年至1081年间拜占庭皇帝的主要居所，是一个包含了宫殿与教堂的大型建筑群，有时也被称作#bold 神圣宫殿#!。\n在长达八百多年的时间里，大皇宫不只是皇帝的居所，同时也是帝国的行政及礼俗中心。"
 HIPPODROME_GLOSS: "君士坦丁堡竞技场完全仿照了罗马马克西穆斯竞技场的式样。竞技场内分布着许多立柱，以及大理石和青铜雕像，中央耸立着从埃及运来的古方尖碑。赛车道铺着沙子，上面可容8辆马车并驾齐驱，周围的看台可容纳上万人观赛。"
 CONSTANTINI_GLOSS: "君士坦丁广场是君士坦丁堡商业和政治活动的第一大中心，其北侧是帝国元老院，其门前几十级宽大的大理石台阶是政要显贵向公众发表演说的论坛。广场中心耸立着一座数十米高的巨型班岩圆柱君士坦丁纪念柱，顶端是阿波罗形象的君士坦丁大帝铜像。"
 ZEUXIPPUS_GLOSS: "宙克西帕斯浴场位于君士坦丁堡大皇宫以北，位于[Glossary( '奥古斯塔广场', 'AUGUSTAION_GLOSS')]和[Glossary( '竞技场', 'HIPPODROME_GLOSS' )]的东北角之间。浴场装饰着众多马赛克、绘画和彩色大理石以及80多尊雕像，描绘了荷马、赫西俄德、柏拉图、亚里士多德、尤利乌斯·凯撒、德摩斯梯尼、埃希尼和维吉尔等历史人物，以及众神和神话英雄。浴场于公元八世纪后被挪做其他用途。"
 PALACE_ANTIOCHOS_GLOSS: "安条克宫是一座建于5世纪早期的宫殿，其标志性的半圆形门廊包围着一个用大理石铺成的庭院，圆形的大厅中央甚至有一个大理石游泳池，而大型的六角形后殿于7世纪被改建为竞技场的圣尤菲米娅教堂，以数十幅描绘了圣人的生平与殉难的精美壁画而著称。"
 NEA_EKKLESIA_GLOSS: "新教堂是在[Glossary( '圣索菲亚大教堂', 'HAGIA_SOPHIA_GLOSS')]之后，皇帝巴西尔一世于君士坦丁堡首都建造的第一座宏伟教堂，它具有一个由五个闪耀着金色光芒的穹顶组成的独特屋顶——中央的穹顶是献给基督的，而四个较小的穹顶则被献给大天使加百列、先知以利亚、圣母玛利亚和圣尼古拉斯。"

 building_type_hagia_sophia_01_desc: "圣索菲亚大教堂是一个真正的工程学奇迹，巨大的穹顶是其最为壮观的特征。\n\n[Glossary( '该建筑', 'HAGIA_SOPHIA_GLOSS')]由皇帝查士丁尼一世于公元537年完工，如今是普世牧首的座堂，是基督教的一座丰碑，也是帝王仪式的首要场地。"
 HAGIA_SOPHIA_GLOSS: "圣索菲亚大教堂，又称阿亚索菲亚大教堂。索菲亚在希腊语里的意思是#bold 神圣智慧#!，因此其希腊语全名可解作#bold 上帝圣智教堂#!。该名意在特别献给天主圣智的那一位，即为耶稣基督。"

## 帕拉丁山
 building_type_palatium_hill_01: "帕拉丁山"
 building_type_palatium_hill_01_desc: "图密善宫坐落于帕拉丁山——罗马七丘之一，这座城市最古老的部分——“宫殿”一词正是来源于此。\n\n自罗慕路斯在此划定城界，帕拉丁山便成为罗马政治权力的中枢。帝国宏伟的宫殿群得到重建，罗马最初的圣地再度熠熠生辉，这片高地与其上的宫殿将始终俯瞰着大竞技场与罗马城，直到永远。"
 building_palatium_hill_01: "大竞技场"
 building_palatium_hill_01_desc: "大竞技场坐落在帕拉丁山与阿文提诺山之间的谷地，是罗马规模最大也是最宏伟的竞技场。\n\n这座巨大的竞技场是罗马市民激情的焦点，其大理石看台可容纳数十万之众。赛道中央矗立着方尖碑与神庙模型，时刻见证着竞技场上的风云变幻。而帕拉丁山上的宫殿与之紧密相连，皇帝可以端坐于御座之上，在市民的欢呼与喧嚣中亲临帝国的盛典。"
 building_palatium_hill_02: "提比略宫"
 building_palatium_hill_02_desc: "帕拉丁山西北侧坐落着由提比略皇帝奠基、卡利古拉皇帝扩建的宫殿翼楼。\n\n提比略宫大体呈矩形，而卡里古拉宫则向外进一步延伸，甚至将卡斯托尔和波吕克斯神庙改造为其宫殿的前厅。迷宫般的厅堂、柱廊与庭院层层叠叠，而一条铺设马赛克地板和精美的天花板装饰的地下长廊将不同宫殿连接在一起，将砖石化为权力的具象表达。"
 building_palatium_hill_03: "帕拉丁大学"
 building_palatium_hill_03_desc: "帕拉丁山的西南角曾经矗立着巍峨的神庙，而今这里成为了皇帝私人藏书与学者研习之所。\n\n居于正中的大理石宫建立在阿波罗神庙的遗址之上，是学术辩论与国事决策的场所；而南北两座宏伟的图书馆分别藏有希腊语与拉丁语的传世典籍，相映成辉。"
 building_palatium_hill_04: "塞维鲁宫"
 building_palatium_hill_04_desc: "在帕拉丁山东南角，塞普提米乌斯·塞维鲁皇帝以前所未有的规模修建了这座宫殿。为了支撑庞大的楼宇，巨型拱券构成的地基犹如人造山峦，其视觉冲击力令人屏息。\n\n在面向阿庇亚大道的一侧，建筑群前方矗立着七重阁，这座高达三层、配有喷泉与柱廊的宏伟景观旨在向所有来访者宣示：罗马的统治者拥有无可匹敌的伟力。"
 building_palatium_hill_05: "图密善宫"
 building_palatium_hill_05_desc: "$building_type_palatium_hill_01_desc$"

## 和平之城
 building_type_madinat_al-salam_01: "和平之城"
 building_type_madinat_al-salam_01_desc: "一座严整的圆形城市矗立在此，她被设计成完美的同心圆。三层城墙将其层层包围，四座大门分别指向东南西北，迎接着来自世界各地的商人、学者与信众。\n\n同心圆的中心是被花园环绕的巨大穹顶建筑——君主的皇宫与宏伟的圣殿——这里是统治的中心，也是世界的中心。"
 building_madinat_al-salam_01: "要塞区"
 building_madinat_al-salam_01_desc: "四座宏伟的城门朝向世界的四个方向，复杂的瓮城结构内设有大量的马厩、军械库、操练场和检查哨所。\n\n这是城市的第一道防线，双层城墙之间的环形地带更设有护城河与吊桥，足以抵御最持久的围攻。高耸的石砌塔楼配备了可以俯瞰整个区域的观察哨，最精锐的禁卫军在进入城市内部的必经之路上巡逻，以确保万无一失。"
 building_madinat_al-salam_02: "市场区"
 building_madinat_al-salam_02_desc: "城市的主干道从城门出发，不断向内侧延伸。这里是商队和物资的集散地，设有官办的税所、大型货栈与车队驿站。\n\n在拱廊交错的街道下，香料与熏香的香气弥漫在空气中，货架上陈列的丝绸与宝石让人目不暇接。来自世界各地的商品与钱币保证了这座城市的财富如河水一般永不枯竭。"
 building_madinat_al-salam_03: "学院区"
 building_madinat_al-salam_03_desc: "大道两侧，内墙之后，是由神殿、学院与图书馆构成的区域，为周边居民提供宗教生活与基础教育。\n\n除了最基础的书写、法律与神学理论之外，还有来自希腊、波斯和印度的僧侣与学者在此讲学，将他们的知识无私地分享给求知之人。只需稍加点拨，智慧的光芒就能比最耀眼的灯火还要明亮。"
 building_madinat_al-salam_04: "花园区"
 building_madinat_al-salam_04_desc: "美丽的花园位于城市的中心，将喧嚣的市井与权力的中枢隔离开来。\n\n利用当地传统的坎儿井与明渠技术，河水得以引入城内。园内的植物分布经过精巧设计，严格按几何图形排列，确保在精密的渠道中纵横交错的清澈河水能滋养到每一株药草、花卉与果树。"
 building_madinat_al-salam_05: "宫殿区"
 building_madinat_al-salam_05_desc: "$building_type_madinat_al-salam_01_desc$"

## 城墙
 building_type_UBA_wall_01:0 "护城墙"
 building_type_UBA_wall_01_desc:0 "$building_UBA_wall_03_desc$"
 building_UBA_wall_01:0 "大城墙"
 building_UBA_wall_01_desc:0 "石墙和塔楼围绕着整座城市，为其中的市民与贵族提供着绝佳的保护。"
 building_UBA_wall_02:0 "大堡垒"
 building_UBA_wall_02_desc:0 "高耸的堡垒给守备者提供了绝佳的守城位置，士兵可以从高处安全地狙击来犯之敌。"
 building_UBA_wall_03:0 "大要塞"
 building_UBA_wall_03_desc:0 "这座令人敬畏的防御工事出自于此地最为优秀的劳工与匠人之手，他们的伟业将在未来的日子里守护无数人民免于战乱之苦。"
 UBA_wanna_build_wall:0 "$building_type_UBA_wall_01$尚未开工"

### 成就建筑
 building_type_UBA_valhalla_01:1 "血与金之城"
 building_type_UBA_valhalla_01_desc:0 "“统一北境之王，征服北海之主，铸就至高王座之人”，诗人们搜肠刮肚，寻找着更加贴切的辞藻来形容你。在诗人们的传唱中，这座城池由黄金铸成，自血海中升起。她将被誉为“米德加尔特的瓦尔哈拉”，地上的英灵殿。"
 building_UBA_valhalla_01:0 "英雄殿"
 building_UBA_valhalla_01_desc:0 "这座雄伟的城池已经尚具雏形，一座庄严肃穆的殿厅已经在中心位置落成，英勇的战士们得以在此相聚。"
 building_UBA_valhalla_02:0 "宴会厅"
 building_UBA_valhalla_02_desc:0 "骁勇的战士们在此地与诸神共饮！肉块、面包与烈酒永远不嫌多！宴会之后，他们就将奔赴荣耀的战场，撕裂敌人的肉体，夺走他们的财富、生命以及一切。"
 building_UBA_valhalla_03:0 "瓦尔哈拉之门"
 building_UBA_valhalla_03_desc:0 "战士们在远洋之外寻得了新式的钢铁以及锻造技术，这无疑是诸神在祝福我等。我们的战士们将装备起这诸神的恩赐，而他们将以此证明信仰的价值。"

 building_type_UBA_headquarter_01:1 "骑士团总部"
 building_type_UBA_headquarter_01_desc:0 "这座堡垒矗立在大地之上，结合了西方和地中海建筑的美学风格与防御结构，仿佛象征着一个全新的时代。圆形大厅宽阔而明亮，墙壁上装饰着各大骑士团华丽的旗帜与象征符号，彰显着骑士们的力量与决心。"
 building_UBA_headquarter_01:0 "圣墓骑士团"
 building_UBA_headquarter_01_desc:0 "为了保护圣地，一座堡垒成为了骑士团的据点。建筑风格质朴而坚固，如同骑士团本身一般。骑士团将会保护朝圣者的安全并巡视周边的道路。"
 building_UBA_headquarter_02:0 "医院骑士团"
 building_UBA_headquarter_02_desc:0 "随着更多骑士团的进驻，堡垒得到了大规模扩建。除了强化城墙防御外，建筑群内增设了功能完备的诊疗所与修道室。在这里，武力守卫与仁慈济世并重，要塞不仅是抵御敌袭的屏障，也是收容伤患与疲惫旅人的避风港。"
 building_UBA_headquarter_03:0 "圣殿骑士团"
 building_UBA_headquarter_03_desc:0 "堡垒四周环绕着坚固的石墙和高塔，最终落成的中央圆形大厅通过拱券结构实现了前所未有的开阔空间。这里集结了最庞大的财富与最精锐的武力，成为了控制地区金融与军事命脉的核心枢纽。"
