 building_type_lianghuai_salt_01:0 "两淮盐场"
 building_type_lianghuai_salt_01_desc:0 "两淮坐拥着漫长的海岸线，自西汉时便有煮海为盐之说。作为海盐的主产区，素有“自古煮盐之利，重于东南，而两淮为最”，“两淮盐税甲天下”之说。"
 building_lianghuai_salt_01:0 "两淮古盐场"
 building_lianghuai_salt_01_desc:0 "$building_type_lianghuai_salt_01_desc$"
