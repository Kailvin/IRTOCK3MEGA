 building_iwami_mines_04_desc: "$building_sado_mines_04_desc$"

 building_type_rongxian_salt_01:0 "荣县盐井"
 building_type_rongxian_salt_01_desc:0 "荣县井盐有着上千年的历史，制盐可上溯到东汉时期，是四川盆地内著名的深井盐产地。工匠们在此凿井千尺，利用独特的深钻汲制工艺提取地下卤水，再经煎煮制盐。"
