 building_type_sado_mines_01: "$building_sado_mines_02$" #佐渡金山
 building_type_sado_mines_01_desc: "$building_sado_mines_01_desc$"
 building_sado_mines_01: "佐渡金山矿坑"
 building_sado_mines_01_desc: "作为一个古老的流放地，鲜有人料想到偏远的佐渡岛地表下竟暗藏如此丰厚的黄金矿藏。"
 building_sado_mines_02: "佐渡金山矿井"
 building_sado_mines_02_desc: "矿坑得到扩建，引进了能真正增加黄金开采量的工程师。"
 building_sado_mines_03: "佐渡金山大矿井"
 building_sado_mines_03_desc: "众多矿坑围绕着一座村庄建起，工人们时常会发现新的黄金矿脉。"
 building_sado_mines_04: "佐渡金山矿业综合体"
 building_sado_mines_04_desc: "黄金的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"
 
 building_type_iwami_mines_01: "$building_iwami_mines_02$"
 building_type_iwami_mines_01_desc: "石见银山或许是日本最大的银矿山，其白银产量相当巨大。此矿为日本对外贸易提供了主要的硬通货，地位至关重要。"
 building_iwami_mines_01: "石见银山矿坑"
 building_iwami_mines_01_desc: "$building_type_iwami_mines_01_desc$"
