 building_type_yanzhou_salt_01:0 "盐池盐场"
 building_type_yanzhou_salt_01_desc:0 "产自西北地区的青白盐，制作精良，价格低廉，广受百姓欢迎。盐池不仅提供了重要的生活物资，其相关产业也成为了当地财政收入的主要来源。"
 building_yanzhou_salt_01:0 "盐池古盐场"
 building_yanzhou_salt_01_desc:0 "$building_type_yanzhou_salt_01_desc$"
 building_yanzhou_salt_02:0 "盐池盐场"
 building_yanzhou_salt_02_desc:1 "人们利用自然的湖盐资源，通过日晒蒸发，收集湖畔结晶的盐块，以满足附近居民的需求。"
 building_yanzhou_salt_03:0 "盐池大盐场"
 building_yanzhou_salt_03_desc:0 "大规模的制盐技术被引入，盐场进一步扩建，产量获得了显著提升。"
 building_yanzhou_salt_04:0 "盐池盐业"
 building_yanzhou_salt_04_desc:0 "随着食盐产量的剧增，盐业专营机构在此设立，负责食盐的征收、储存和转运。"

 building_type_xiechi_salt_01:0 "解池盐场"
 building_type_xiechi_salt_01_desc:0 "解池又名河东盐池，传说黄帝杀蚩尤，血化为卤，就成为了解池。解池盐场以生产潞盐为主，百里盐湖，浩浩荡荡，十分壮观。"
 building_xiechi_salt_01:0 "解池古盐场"
 building_xiechi_salt_01_desc:0 "$building_type_xiechi_salt_01_desc$"
 building_xiechi_salt_02:0 "解池盐场"
