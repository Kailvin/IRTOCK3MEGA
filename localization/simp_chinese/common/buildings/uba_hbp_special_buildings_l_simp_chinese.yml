 building_type_yanguan_salt_01:0 "盐官盐场"
 building_type_yanguan_salt_01_desc:0 "得益于杭州湾的滩涂辽阔，涌潮不断地冲刷北岸，虽然岸线动荡不稳，但也为盐业带来了机遇。在几百年间，盐官盐场规模不断扩大，几列全国海煮盐场之首。"
