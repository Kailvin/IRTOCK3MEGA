l_simp_chinese:
# 剧场
 building_type_UBA_colosseum_01:1 "大剧场"
 building_type_UBA_colosseum_01_desc:0 "$building_UBA_colosseum_01_desc$"
 building_UBA_colosseum_01:0 "小剧场"
 building_UBA_colosseum_01_desc:0 "此地正在建造一座宏伟的剧场的消息不胫而走——即便剧场还未真正开始建设。但没有什么能阻挡人们对戏剧的喜爱，有的小剧团甚至已经在附近的空地上开始表演了。"
 building_UBA_colosseum_02:0 "露天剧场"
 building_UBA_colosseum_02_desc:0 "有好戏上演的日子里，这座小小的露天剧场都会挤满观众。演员占据舞台中央，舒活声带，吟诵台词——这让市民们为他们的小剧场感到骄傲。"
 building_UBA_colosseum_03:0 "半圆形剧场"
 building_UBA_colosseum_03_desc:0 "剧场仿照着希腊剧场的样式进行了进一步扩大，观众席被利用券拱结构抬升，从而能够提供更多的看台席位。而巧妙设计的地下水渠则能提供表演用水与洁净的饮用水。"
 building_UBA_colosseum_04:0 "圆形剧场"
 building_UBA_colosseum_04_desc:0 "两个半圆形的剧场通过柱廊相互对接，形成了所谓的圆形剧场。看台被进一步扩大，并装设了遮阳用的天棚。除了传统戏剧之外，圆形剧场还开始承演精彩的竞技比赛与新奇的海战表演。"
 building_UBA_colosseum_05:0 "传奇剧场"
 building_UBA_colosseum_05_desc:0 "宏伟的券廊支撑着足以承载数万人的看台，巧妙的入场设计避免了拥堵混乱的发生；而舞台地下则隐藏着数个房间与走道，用以存放表演所用的道具和牲畜。数不尽的盛大场面都在其中上演——如今这座剧场已经成为了真正的奇迹，即便真正的罗马人也会为此啧啧称奇。"
 UBA_colosseum_building:0 "有正在建造中的$building_type_UBA_colosseum_01$"
 UBA_colosseum_finished:0 "已建成完美的$building_type_UBA_colosseum_01$"
 UBA_colosseum_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_piazza_01$#!线[buildings|E]"
# 宫殿
 building_type_UBA_palace_01:1 "大皇宫"
 building_type_UBA_palace_01_desc:0 "$building_UBA_palace_05_desc$"
 building_UBA_palace_01:0 "泉宫"
 building_UBA_palace_01_desc:0 "作为君主的寝宫，泉宫是最早完工的建筑之一。其是大皇宫的主要一翼，除了作为君主的就寝场所之外，还兼为宫内重要的礼仪场所。"
 building_UBA_palace_02:0 "夏宫"
 building_UBA_palace_02_desc:0 "夏宫位于风景最为优美的地方。附近设有君主专用的狩猎场，并配有完善的配套设施。而宫殿本身则被各类新奇而美丽的植物环绕，奇花异草争奇斗艳。唯有在这里，君主才能将俗世的纷扰排除在外，寻得一处安宁舒适的避风港。"
 building_UBA_palace_03:0 "金宫"
 building_UBA_palace_03_desc:0 "金宫结合了王座厅与宴会厅的作用。君主的宝座位于三级台阶之上，华贵典雅，点缀着珍珠和宝石。大理石地面上铺着精美的锦缎地毯，君主将在这里接见各处而来的使节。"
 building_UBA_palace_04:0 "冬宫"
 building_UBA_palace_04_desc:0 "即便在最严酷寒冷的冬季里，这座宫殿内部也是温暖如春。宫内设有舞厅与书房，无论是好动还是喜静，人们都能在这里度过一段愉快的时光。而庞大的地窖则确保了它的主人绝无缺乏物资之忧。"
 building_UBA_palace_05:0 "圣宫"
 building_UBA_palace_05_desc:0 "它并非是一座建筑，而是一整个宫殿建筑群。它规模宏伟、气势磅礴，包括了正殿、寝宫、御花园、以及图书馆、艺术馆等诸多宫室。它的存在就已经证明了它主人的实力和财富，而它还将见证这片领地更为辉煌的未来。"
 UBA_palace_building:0 "有正在建造中的$building_type_UBA_palace_01$"
 UBA_palace_finished:0 "已建成完美的$building_type_UBA_palace_01$"
 UBA_palace_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_residence_01$#!线[buildings|E]"
# 林苑
 building_type_UBA_reserve_01:1 "御林苑"
 building_type_UBA_reserve_01_desc:0 "$building_UBA_reserve_05_desc$"
 building_UBA_reserve_01:0 "保留地"
 building_UBA_reserve_01_desc:0 "大片的森林、山峦、河流被一同圈入君主私家的保留地中。普通人被限制进入这片保护区，以最大限度地保护这片地区的自然风貌。"
 building_UBA_reserve_02:0 "纪念碑"
 building_UBA_reserve_02_desc:0 "君王的形象在石头上变得不朽，无数传奇因这座纪念碑而被后人称颂。这座纪念碑不仅纪念了其委托建造者的伟大事迹，而且任何在领地内持有它的人都可以宣称对这个传奇的守护权。"
 building_UBA_reserve_03:0 "植物园"
 building_UBA_reserve_03_desc:0 "植物园内种植着来自各地的奇花异草，不单单只是为了观赏价值，其中一些还可入药。"
 building_UBA_reserve_04:0 "鸟兽林"
 building_UBA_reserve_04_desc:0 "山林间散养着君主从各地搜罗而来的珍奇动物，以供游猎取乐之用。而部分不适宜放归野外的动物则被饲养在新建成的珍兽馆内。"
 building_UBA_reserve_05:0 "御林苑"
 building_UBA_reserve_05_desc:0 "扩建后的御林苑规模宏大惊人。它如今已是一座庞大而震撼的园林景观：细心雕琢的自然景观恢宏而壮丽，数座奢华宫苑点缀其间。倘若登高远眺，景观美不胜收。"
 UBA_reserve_building:0 "有正在建造中的$building_type_UBA_reserve_01$"
 UBA_reserve_finished:0 "已建成完美的$building_type_UBA_reserve_01$"
 UBA_reserve_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_manor_01$#!线[buildings|E]"
# 要塞
 building_type_UBA_castle_01:0 "大要塞"
 building_type_UBA_castle_01_desc:0 "$building_UBA_castle_05_desc$"
 building_UBA_castle_01:0 "大城墙"
 building_UBA_castle_01_desc:0 "一道拥有护城河的高大城墙正在围绕着要塞的基址建立起来。建设工作尚在进行中，但已经能够想象到这座要塞完成后的宏伟图景。"
 building_UBA_castle_02:0 "大堡垒"
 building_UBA_castle_02_desc:0 "堡垒的主体部分拥有若干座塔楼，其本身又被城墙、碉堡以及护城河环绕，坚固的城墙和碉堡使要塞可以坚持到援兵到达。"
 building_UBA_castle_03:0 "士兵营区"
 building_UBA_castle_03_desc:0 "在经过进一步建设之后，要塞的规模已经拓展了一倍有余。内部增设的营区驻扎有精锐的士兵，而在营区中培训出的优秀军官则被派往领地各处指导士兵训练。"
 building_UBA_castle_04:0 "指挥所"
 building_UBA_castle_04_desc:0 "这座宏伟要塞已经成为了地区防御战略的核心，因此也成为了地区的军事中枢。"
 building_UBA_castle_05:0 "宏伟要塞"
 building_UBA_castle_05_desc:0 "这座坚不可破的堡垒有着高耸的石墙、宽广的护城河以及数幢厚重的塔楼。并且在发挥军事要塞的本职之余还可以充当王室居所、训练营地以及监狱。"
 UBA_castle_building:0 "有正在建造中的$building_type_UBA_castle_01$"
 UBA_castle_finished:0 "已建成完美的$building_type_UBA_castle_01$"
 UBA_castle_unlocks_desc:0 "可以在任意地区修建#V $building_type_regimental_grounds_01$#!、#V $building_type_warrior_lodges_01$#!或#V $building_type_hillside_grazing_01$#!"
# 瞭望塔
 building_type_UBA_tower_01:0 "大灯塔"
 building_type_UBA_tower_01_desc:0 "$building_UBA_tower_05_desc$"
 building_UBA_tower_01:0 "灯塔"
 building_UBA_tower_01_desc:0 "一座高耸的塔楼被建立起来，而在夜间为行人和行船指引方位。"
 building_UBA_tower_02:0 "瞭望台"
 building_UBA_tower_02_desc:0 "灯塔上增设了一个瞭望台，可供人瞭望周围环境，用于监视可能的敌军进犯。"
 building_UBA_tower_03:0 "瞭望塔"
 building_UBA_tower_03_desc:0 "塔楼被进一步加高加固，一系列附属建筑围绕着主体部分建立起来。随着永久营区的建设，负责地区防御的士兵时常会驻扎在塔楼附近。"
 building_UBA_tower_04:0 "高塔"
 building_UBA_tower_04_desc:0 "高耸入云的塔楼在数里之外都清晰可见，而对于塔上的瞭望者而已，大地上的一切也都仿佛触手可及。"
 building_UBA_tower_05:0 "巨塔"
 building_UBA_tower_05_desc:0 "这座高耸入云、令人敬畏的塔楼被用于监视潜在入侵者的攻击，并且其本身就是一座防御性极高的堡垒。同时，它还为行人指引方位，忠实地发挥灯塔的职能。"
 UBA_tower_building:0 "有正在建造中的$building_type_UBA_tower_01$"
 UBA_tower_finished:0 "已建成完美的$building_type_UBA_tower_01$"
 UBA_tower_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_checkpoint_01$#!线[buildings|E]"
# 军校
 building_type_UBA_knight_01:0 "大军校"
 building_type_UBA_knight_01_desc:0 "$building_UBA_knight_05_desc$"
 building_UBA_knight_01:0 "训练营地"
 building_UBA_knight_01_desc:0 "一处专为训练骑士而建设的场地。无数有志青年将在这里为他们的梦想挥洒汗水……可能还有泪水和血水。"
 building_UBA_knight_02:0 "骑士军校"
 building_UBA_knight_02_desc:0 "任何有志成为骑士者——无论出身——都将在此地得到完整的军事教育，他们将在这里学习所有的战场战略、军队组织和最新的战争技术知识。"
 building_UBA_knight_03:0 "比武场"
 building_UBA_knight_03_desc:0 "在经过进一步建设之后，军校的规模已经拓展了一倍有余。大片的空地被规划为学员的训练场地，他们将在这里成为一名合格的骑士。"
 building_UBA_knight_04:0 "骑士礼堂"
 building_UBA_knight_04_desc:0 "生命和记忆都是转瞬即逝之物，但骑士的荣耀将在一代代骑士心中传承下去。"
 building_UBA_knight_05:0 "荣耀军校"
 building_UBA_knight_05_desc:0 "这座学院培养了一代又一代杰出的骑士。任何有志成为骑士者——无论出身——都将在此地得到完整的军事教育。"
 UBA_knight_building:0 "有正在建造中的$building_type_UBA_knight_01$"
 UBA_knight_finished:0 "已建成完美的$building_type_UBA_knight_01$"
 UBA_knight_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_joust_01$#!线[buildings|E]"
# 大法院
 building_type_UBA_governor_01:0 "大法院"
 building_type_UBA_governor_01_desc:0 "$building_UBA_governor_05_desc$"
 building_UBA_governor_01:0 "裁判所"
 building_UBA_governor_01_desc:0 "领地内的小事不该由君主烦心，几位尽心尽职的官僚足以应付。"
 building_UBA_governor_02:0 "地方法庭"
 building_UBA_governor_02_desc:0 "地方法官通常由地方乡绅担任，他们被授权以负责维护地方治安、管理公共事务，以及征收税金与罚款。"
 building_UBA_governor_03:0 "治安委员会"
 building_UBA_governor_03_desc:0 "作为君主任命的地方官员，治安法官有义务执行中央政令，向领主汇报地方政务；并兼顾地方民情，因地制宜地制定社会政策。"
 building_UBA_governor_04:0 "巡回法庭"
 building_UBA_governor_04_desc:0 "君主从王室法院中派出巡回法官，到各地进行巡回审判。巡回法庭公正合理的审判在民众之间也广受欢迎。"
 building_UBA_governor_05:0 "最高法院"
 building_UBA_governor_05_desc:0 "这座法院负责审理所有具重要性和具法律价值的案件，其权力凌驾于所有下级法院。法官们坐镇此处，协助君主打理这片广袤的领地。"
 UBA_governor_building:0 "有正在建造中的$building_type_UBA_governor_01$"
 UBA_governor_finished:0 "已建成完美的$building_type_UBA_governor_01$"
 UBA_governor_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_taxing_01$#!线[buildings|E]"
# 工坊
 building_type_UBA_workshop_01:0 "大工坊"
 building_type_UBA_workshop_01_desc:0 "$building_UBA_workshop_05_desc$"
 building_UBA_workshop_01:0 "初级工坊"
 building_UBA_workshop_01_desc:0 "一批白手起家的工匠来到这里建立起了他们自己的工坊。简单的工具堆放在工作台边，工匠们会用它们熟练地打造工具。"
 building_UBA_workshop_02:0 "小型工坊"
 building_UBA_workshop_02_desc:0 "工坊摆满了各式各样的工具设备，工匠们在这里大显身手——制造出的产品处理供应本地之外，甚至还能出口到其他地区。"
 building_UBA_workshop_03:0 "大型工坊"
 building_UBA_workshop_03_desc:0 "工坊里每天都充满着创意和挑战。工匠们尝试着使用新材料、运用新工艺，从而打造出独一无二的好东西。"
 building_UBA_workshop_04:0 "综合工坊"
 building_UBA_workshop_04_desc:0 "工坊是工匠们展现才艺的艺术殿堂，他们将技艺发挥到了极致。作品不仅令人惊叹于其工艺之高超，更显现出了创作者对美学的认识。"
 building_UBA_workshop_05:0 "传奇工坊"
 building_UBA_workshop_05_desc:0 "这里是工匠们云集之地，也是领地技术进步的中心。只需要工具、原料、智慧与汗水，匠人们总是能创造出无与伦比的奇迹。"
 UBA_workshop_building:0 "有正在建造中的$building_type_UBA_workshop_01$"
 UBA_workshop_finished:0 "已建成完美的$building_type_UBA_workshop_01$"
 UBA_workshop_unlocks_desc:0 "可以在任意地区修建#V $building_type_wind_furnace_01$#!线[buildings|E]"
# 议会宫
 building_type_UBA_parliament_01:0 "大议会"
 building_type_UBA_parliament_01_desc:0 "$building_UBA_parliament_05_desc$"
 building_UBA_parliament_01:0 "议会厅"
 building_UBA_parliament_01_desc:0 "议会厅的陈设简朴而庄重，设有基本的座位和讨论区域。来自领地各处的代表得以在此围绕着各项议题发表意见、开展讨论。"
 building_UBA_parliament_02:0 "元老院"
 building_UBA_parliament_02_desc:0 "元老院由出身贵族与教士的代表组成。他们身份崇高、权势显赫，却能齐聚一堂，在领地的大小事宜上发表意见。"
 building_UBA_parliament_03:0 "人民院"
 building_UBA_parliament_03_desc:0 "人民院的议员大多出身于商人、士兵、市民与农民。他们的声音来自底层，代表着平民的利益与愿望。"
 building_UBA_parliament_04:0 "枢密院"
 building_UBA_parliament_04_desc:0 "枢密院的顾问官员由君主亲自任命，他们负责就领地的重大事务向君主提供意见，而且几乎总是会被采纳。"
 building_UBA_parliament_05:0 "议会宫"
 building_UBA_parliament_05_desc:0 "这座矗立于城市中心的建筑物汇聚了来自贵族、市民、教士各个阶级的代表。元老院与人民院相互对立，却又相互补充，权力与正义达成了微妙的均衡。"
 UBA_parliament_building:0 "有正在建造中的$building_type_UBA_parliament_01$"
 UBA_parliament_finished:0 "已建成完美的$building_type_UBA_parliament_01$"
 UBA_parliament_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_townhall_01$#!线[buildings|E]"
# 医院
 building_type_UBA_hospital_01:0 "大医院"
 building_type_UBA_hospital_01_desc:0 "$building_UBA_hospital_05_desc$"
 building_UBA_hospital_01:0 "病患小屋"
 building_UBA_hospital_01_desc:0 "环境简陋，但已经初具规模的医院设施。医生得以在还算体面的环境下收治病患，而病者也能得到一处安静的疗养地。"
 building_UBA_hospital_02:0 "草药房"
 building_UBA_hospital_02_desc:0 "草药师从各地收集来的草药经过加工，便成为了更易用、更耐储存的药剂制品。而医生则以此为病患提供草药治疗。"
 building_UBA_hospital_03:0 "隔离病房"
 building_UBA_hospital_03_desc:0 "危险的传染病患者被收治在相对独立的隔离病房中，只有最勇敢的医生敢于前去照料他们。希望他们能够平安无事。"
 building_UBA_hospital_04:0 "扩展病房"
 building_UBA_hospital_04_desc:0 "为了应对可能发生的瘟疫而在医院附近的空地临时设置的扩展病房逐渐成了常设病房，它们给了严重受苦的受害者活下去的希望。"
 building_UBA_hospital_05:0 "医院与救济院"
 building_UBA_hospital_05_desc:0 "救济院为那些快挺不过来的人提供长期照料，而一座位于中心地带的中央医院大楼则为所有救济院提供护理支持。"
 UBA_hospital_building:0 "有正在建造中的$building_type_UBA_hospital_01$"
 UBA_hospital_finished:0 "已建成完美的$building_type_UBA_hospital_01$"
 UBA_hospital_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_bathroom_01$#!和#V $building_type_uba_herbal_01$#!线[buildings|E]"
# 大学
 building_type_UBA_university_01:0 "大学院"
 building_type_UBA_university_01_desc:0 "$building_UBA_university_05_desc$"
 building_UBA_university_01:0 "法学院"
 building_UBA_university_01_desc:0 "$building_type_generic_university_desc$\n\n法学院是最初的学院，语法学、修辞学和逻辑学的学者们聚集一堂，共同评注古老的法典以及现今的法律案例。"
 building_UBA_university_02:0 "文学院"
 building_UBA_university_02_desc:0 "$building_type_generic_university_desc$\n\n文学院是研究文学和语言的场所。学生在此学习语言，研习各类经典文学作品，包括诗歌与戏剧。"
 building_UBA_university_03:0 "神学院"
 building_UBA_university_03_desc:0 "$building_type_generic_university_desc$\n\n神学院是大学中最重要的学院之一。在这里，学生们学习各类神学典籍，探讨信仰、道德以及人的灵魂。"
 building_UBA_university_04:0 "哲学院"
 building_UBA_university_04_desc:0 "$building_type_generic_university_desc$\n\n哲学院是研究哲学思想和思辨问题的场所。学生们学习古代和现代的经典哲学著作。而慕名而来的学者则在此交换各自的知识、智慧，以及书籍。"
 building_UBA_university_05:0 "科学院"
 building_UBA_university_05_desc:0 "$building_type_generic_university_desc$\n\n来自各地的学者与科学家们在此地辩论、研究、记录，最终将他们的知识汇集在大学的围墙内。这所久负盛名的大学已然成为了这片地区最令人瞩目的学术中心。"
 UBA_university_building:0 "有正在建造中的$building_type_UBA_university_01$"
 UBA_university_finished:0 "已建成完美的$building_type_UBA_university_01$"
 UBA_university_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_library_01$#!线[buildings|E]"
# 圣殿
 building_type_UBA_church_01:0 "大圣殿"
 building_type_UBA_church_01_desc:0 "$building_UBA_church_05_desc$"
 building_UBA_church_01:0 "祈祷之所"
 building_UBA_church_01_desc:0 "一座宁静的圣堂，布置朴素而庄重。宁静的内部空间为前来的信徒提供了一个默默祈祷的绝佳场所。"
 building_UBA_church_02:0 "沉思之所"
 building_UBA_church_02_desc:0 "高大的柱廊撑起宏伟的拱顶，美丽的壁画与纹饰装饰着圣堂的各个立面。在熏香和光照营造的神圣氛围之中，信徒们一同祈祷，一同沉思。"
 building_UBA_church_03:0 "敬拜之所"
 building_UBA_church_03_desc:0 "圣殿宏伟而庄严，巨大的穹顶高耸入云，整个建筑由石柱支撑。屋顶和外墙由繁复而华丽的雕塑和纹饰点缀。信徒得以沉浸在庄严肃穆的氛围之中。"
 building_UBA_church_04:0 "礼颂之所"
 building_UBA_church_04_desc:0 "这座宏伟的圣殿充满了神圣而庄严的气息，内外皆由华丽的雕刻和壁画装饰。而祭坛上供奉的珍贵圣物所散发的神圣气息更是让人心生敬畏。"
 building_UBA_church_05:0 "神圣之所"
 building_UBA_church_05_desc:0 "一座宏伟而壮丽的圣殿，高耸的穹顶直指天空，华丽的装饰让它显得格外神圣。全世界的朝圣者都会愿意来到此地，这能让他们离崇拜的神明更近一步。而他们无不为这座圣殿感叹、折服。每个人都深信一个事实——我们确实为神眷顾。"
 UBA_church_building:0 "有正在建造中的$building_type_UBA_church_01$"
 UBA_church_finished:0 "已建成完美的$building_type_UBA_church_01$"
 UBA_church_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_temple_01$#!线[buildings|E]"
# 市场
 building_type_UBA_market_01:0 "大市场"
 building_type_UBA_market_01_desc:0 "$building_UBA_market_05_desc$"
 building_UBA_market_01:0 "集市"
 building_UBA_market_01_desc:0 "农民、手工艺人和小商贩们聚集在这里，简陋的摊位上摆放着农产品、手工艺品和日常用品等简单的货物。"
 building_UBA_market_02:0 "贸易广场"
 building_UBA_market_02_desc:0 "在这个熙熙攘攘的大市场中，各种各样的摊位密布其间。商品琳琅满目：香料、布匹，还有工艺品。人们在拥挤的街道间穿行，挑选着自己心仪的货物。"
 building_UBA_market_03:0 "商业街"
 building_UBA_market_03_desc:0 "随着市场规模的扩大，商业街道被进一步拓宽。商铺和店面琳琅满目，提供各式各样的商品和服务，吸引了来自远方的商人和旅客。"
 building_UBA_market_04:0 "交易所"
 building_UBA_market_04_desc:0 "仓储条件的提升使得大批量货物的交易成为可能。这里汇聚着来自各地的商人和商会，大宗贸易让金钱、货物乃至期货流转不息。"
 building_UBA_market_05:0 "商业中心"
 building_UBA_market_05_desc:0 "这里的市场和仓储设施规模庞大、功能完备，汇聚了来自各地的商人与旅客。商贾云集，店铺林立。它已然成为了整个领地，乃至整个地区的商业中心。"
 UBA_market_building:0 "有正在建造中的$building_type_UBA_market_01$"
 UBA_market_finished:0 "已建成完美的$building_type_UBA_market_01$"
 UBA_market_unlocks_desc:0 "可以在任意地区修建#V $building_type_caravanserai_01$#!线[buildings|E]"
# 港口
 building_type_UBA_port_01:1 "大港口"
 building_type_UBA_port_01_desc:0 "$building_UBA_port_05_desc$"
 building_UBA_port_01:0 "避风港"
 building_UBA_port_01_desc:0 "一个坐落在水滨的不起眼的码头，但她为无数商人和渔民提供了停泊和买卖货物所需的充足空间，每日都有许多船只来往。远道而来的旅人在这座港口，寻求避风港的庇佑。"
 building_UBA_port_02:0 "贸易港"
 building_UBA_port_02_desc:0 "这处港口为无数商人和渔民提供了停泊和买卖货物所需的充足空间。随着规模的扩大，这座港口已成为这片地区的贸易与旅行中心。来自沿海沿河各地的船只都来这里进行贸易。"
 building_UBA_port_03:0 "商业港"
 building_UBA_port_03_desc:0 "海关和税收机构为港口的贸易活动提供了基本保障。健全的管理设施和运营机制也被建立起来，以保证港口的效率和秩序。"
 building_UBA_port_04:0 "$building_common_tradeport_06$"
 building_UBA_port_04_desc:0 "$building_common_tradeport_06_desc$"
 building_UBA_port_05:0 "大港口"
 building_UBA_port_05_desc:0 "这个大港口提供了海量的泊位、船坞，以及该区域最为出色的水手。所有需要长途旅行的旅客都能在这里找到所需的商品，另一方面，商人、渔民、军队也能在这里买到他们想要的必需品。"
 UBA_port_building:0 "有正在建造中的$building_type_UBA_port_01$"
 UBA_port_finished:0 "已建成完美的$building_type_UBA_port_01$"
 UBA_port_unlocks_desc:0 "可以在任意地区修建#V $building_type_caravanserai_01$#!线[buildings|E]"
# 圣城
 building_type_UBA_holyland_01:0 "诸圣城"
 building_type_UBA_holyland_01_desc:0 "$building_UBA_holyland_01_desc$"
 building_UBA_holyland_01:0 "和睦之梦"
 building_UBA_holyland_01_desc:0 "“让我等的后人忘却争斗吧！和平的旗帜将从此高高飘扬在这片土地上！”"
 building_UBA_holyland_02:0 "和平之种"
 building_UBA_holyland_02_desc:0 "“若希望之花能够在和平的田野上绽放，我们又该用什么去浇灌它？”\n“爱。”"
 building_UBA_holyland_03:0 "希望之花"
 building_UBA_holyland_03_desc:0 "“不同的信徒都只晓聆听各自神明的教诲，却忘记了我等都同样体验过那神圣的灵感，那创世的神迹。”"
 building_UBA_holyland_04:0 "和谐之地"
 building_UBA_holyland_04_desc:0 "“信仰是拯救我们灵魂的唯一希望，而人性能是拯救我们现世的美德与智慧。”"
 building_UBA_holyland_05:0 "梦想之城"
 building_UBA_holyland_05_desc:0 "不同的信徒信奉着不同的神祇，但他们如今都和谐地生活在同一座城市中。\n一座座神殿矗立在这座城市中，是多元的信仰，使她如彩虹般绚烂美丽。\n慈悲、宽容、友爱，构成了此世间最伟大而渺小的神迹。"
 UBA_holyland_building:0 "有正在建造中的$building_type_UBA_holyland_01$"
 UBA_holyland_finished:0 "已建成完美的$building_type_UBA_holyland_01$"
 UBA_holyland_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_bazaar_01$#!线[buildings|E]"
# 水库
 building_type_UBA_basins_01:0 "大水库"
 building_type_UBA_basins_01_desc:0 "$building_UBA_basins_05_desc$"
 building_UBA_basins_01:0 "露天水池"
 building_UBA_basins_01_desc:0 "$building_kairouan_basins_01_desc$"
 building_UBA_basins_02:0 "拦河大坝"
 building_UBA_basins_02_desc:0 "通过修筑高大的堤坝，我们可以拦截水流，形成壮观的水库。堤坝不仅增加了蓄水量，能够支持更大规模的灌溉，还在一定程度上减轻了洪涝灾害的威胁。"
 building_UBA_basins_03:0 "巨型水库"
 building_UBA_basins_03_desc:0 "采用石块进一步加固水库的堤坝，能够显著提高水库的稳定性和蓄水能力。更可靠的水源供应为进一步发展水利工程提供了坚实的基础。"
 building_UBA_basins_04:0 "地下水宫"
 building_UBA_basins_04_desc:0 "工程技术的进步使得修建大型的地下蓄水库成为可能。巨大的地下空间由无数石柱支撑，不仅能够储存充足的水源，有效应对长期的旱灾，还能为城市居民提供清洁的饮用水，为经济发展和农业繁荣提供有力保障。"
 building_UBA_basins_05:0 "水利枢纽"
 building_UBA_basins_05_desc:0 "这座水利枢纽集蓄水、防洪和灌溉于一体。完善的水库和水道系统能够精确控制水流，最大限度地利用水资源。水不仅是城市居民的命脉，也是领地繁荣和抵御自然灾害的关键。"
 UBA_basins_building:0 "有正在建造中的$building_type_UBA_basins_01$"
 UBA_basins_finished:0 "已建成完美的$building_type_UBA_basins_01$"
 UBA_basins_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_aqueduct_01$#!、#V $building_type_qanats_01$#!和#V $building_type_uba_bathroom_01$#!线[buildings|E]"
# 图书馆
 building_type_UBA_academy_01:1 "大书库"
 building_type_UBA_academy_01_desc:0 "$building_UBA_academy_05_desc$"
 building_UBA_academy_01:0 "图书馆"
 building_UBA_academy_01_desc:0 "图书馆藏书丰富，小到契约，大到神学巨著。知识的宝库就位于它的围墙之内。"
 building_UBA_academy_02:0 "誊抄馆"
 building_UBA_academy_02_desc:0 "专心致志的书吏整日工作，抄写和整理各种书籍和文献。而有些也会负责为潜在的作者抄写他们的作品。"
 building_UBA_academy_03:0 "翻译馆"
 building_UBA_academy_03_desc:0 "热忱的人们在此接受古代和外国语言的教育。正是依靠着无数长于此道的书吏，我们才得以保存下古人的智慧。"
 building_UBA_academy_04:0 "禁书馆"
 building_UBA_academy_04_desc:0 "一些不那么普通的书籍和文献被收藏在禁书馆中，严格的保密和安全措施确保常人难以接触到这些“危险”的资料。"
 building_UBA_academy_05:0 "档案馆"
 building_UBA_academy_05_desc:0 "大书库卷帙浩繁，书吏焚膏继晷，以将更多伟大的文学著作翻译并加以保存。历史档案和文献被巧妙地分门别类，汇聚在不计其数的书架之间。"
 UBA_academy_building:0 "有正在建造中的$building_type_UBA_academy_01$"
 UBA_academy_finished:0 "已建成完美的$building_type_UBA_academy_01$"
 UBA_academy_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_library_01$#!线[buildings|E]"
# 花园
 building_type_UBA_garden_01:1 "御花园"
 building_type_UBA_garden_01_desc:0 "$building_UBA_garden_05_desc$"
 building_UBA_garden_01:0 "私人花园"
 building_UBA_garden_01_desc:0 "大片选定的土地被石墙框定起来。在这处远离尘嚣的乐土中，园丁悉心照料着植物。"
 building_UBA_garden_02:0 "庭院花园"
 building_UBA_garden_02_desc:0 "花园布置精美，除了精心修剪的花草之外，还装饰有喷泉和雕塑。除了个人放松之外，还可用于举办各类社交活动。"
 building_UBA_garden_03:0 "壮丽花园"
 building_UBA_garden_03_desc:0 "富裕而有权势的人自然需要昂贵而壮丽的花园。在一大批园丁的照料下，来自各地的稀奇花草果树争奇斗艳。"
 building_UBA_garden_04:0 "珍奇花园"
 building_UBA_garden_04_desc:0 "在花园繁盛美景的背后，辛勤的园丁与草药师们正在尝试培育更加优良的植株。奇妙植物不但能使这座花园变得更加美妙，还有助于疾病康复。"
 building_UBA_garden_05:0 "行宫花园"
 building_UBA_garden_05_desc:0 "这里已然成为一处震撼人心的园林建筑群，华美的建筑与珍奇的植物吸引了无数远方来客。精心设计的花坛、雕塑和水景与壮观的宫殿和庭院建筑相得益彰，拥有一座这样的花园是每位贵族的梦想。"
 UBA_garden_building:0 "有正在建造中的$building_type_UBA_garden_01$"
 UBA_garden_finished:0 "已建成完美的$building_type_UBA_garden_01$"
 UBA_garden_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_herbal_01$#!、#V $building_type_uba_olive_01$#!、#V $building_type_uba_vineyard_01$#!、#V $building_type_uba_tea_01$#!、#V $building_type_uba_silk_01$#!线[buildings|E]"
# 秘宫
 building_type_UBA_secret_01:1 "大秘宫"
 building_type_UBA_secret_01_desc:0 "$building_UBA_secret_05_desc$"
 building_UBA_secret_01:0 "隐秘庭院"
 building_UBA_secret_01_desc:0 "幽暗的宫殿潜藏在深山密林之间，出入口被茂密的植物掩蔽，只有极少数人能知晓其存在。不为人知的秘密就潜藏在那庭院之中。"
 building_UBA_secret_02:0 "幻境花园"
 building_UBA_secret_02_desc:0 "秘宫之内是一座诡秘的花园，看似美丽诱人，实则充满了危险。来人稍有不慎便会被秘药迷了心智，从而迷失在真真假假的花草树木与雕塑装饰之间。"
 building_UBA_secret_03:0 "迷宫秘堡"
 building_UBA_secret_03_desc:0 "城堡内部结构错综复杂，很难有人能独自摸清布局。真实的路线被刻意设计的光照条件巧妙隐藏在错误的岔路之间，若是没有知情者引路，几乎没有可能找到正确的路径。"
 building_UBA_secret_04:0 "幽暗地牢"
 building_UBA_secret_04_desc:0 "那些最可悲而不幸的囚犯被关押在这重重迷宫之内的地牢中，牢房外设有各种严密的监视和其他安全措施。即便撤去守卫，打开牢房，这些囚犯也未必能找到出去的路。"
 building_UBA_secret_05:0 "暗影王座"
 building_UBA_secret_05_desc:0 "白日西沉，夜幕降下，\n黑夜的王将要夺去地上的权柄。\n他高居王座之上，投下骇人的暗影。"
 UBA_secret_building:0 "有正在建造中的$building_type_UBA_secret_01$"
 UBA_secret_finished:0 "已建成完美的$building_type_UBA_secret_01$"
 UBA_secret_unlocks_desc:0 "可以在任意地区修建#V $building_type_uba_private_01$#!线[buildings|E]"
# 猎场
 building_type_UBA_hunting_01:1 "御猎苑"
 building_type_UBA_hunting_01_desc:0 "$building_UBA_hunting_01_desc$"
 building_UBA_hunting_01:0 "狩猎场"
 building_UBA_hunting_01_desc:0 "大片未经开发的土地被指定为保护区，未经授权的猎人被将禁止入内，以确保猎场的主人总是能打到足够的猎物。"
 building_UBA_hunting_02:0 "犬舍与鸟舍"
 building_UBA_hunting_02_desc:0 "猎犬与猎鹰都是猎人的好伙伴。它们平日里被委托给专人照顾，而狩猎时则成为猎人的助力。"
 building_UBA_hunting_03:0 "围栏与马厩"
 building_UBA_hunting_03_desc:0 "$building_hunting_grounds_05_desc$"
 building_UBA_hunting_04:0 "狩猎馆舍"
 building_UBA_hunting_04_desc:0 "$building_legendary_hunting_lodge_desc$"
 building_UBA_hunting_05:0 "皇家猎宫"
 building_UBA_hunting_05_desc:0 "狩猎和居住的功能建筑皆建设在狩猎场边缘。除了常规的狩猎馆舍之外还建有奢华的猎宫，其内部设有宽敞的客厅、卧室和宴会厅，以及配备齐全的厨房和休闲设施。"
 UBA_hunting_building:0 "有正在建造中的$building_type_UBA_hunting_01$"
 UBA_hunting_finished:0 "已建成完美的$building_type_UBA_hunting_01$"
 UBA_hunting_unlocks_desc:0 "可以在任意地区修建#V $building_type_horse_pastures_01$#!或#V $building_type_uba_fur_01$#!线[buildings|E]"
# 牧场
 building_type_UBA_pasture_01:1 "大牧场"
 building_type_UBA_pasture_01_desc:0 "$building_UBA_pasture_01_desc$"
 building_UBA_pasture_01:0 "天然牧场"
 building_UBA_pasture_01_desc:0 "我们的放牧依赖于自然的馈赠。辽阔的草原提供了丰美的牧草和水源，我们的牲畜——山羊、绵羊、马、骆驼和牛在草原上自由奔跑。"
 building_UBA_pasture_02:0 "草场轮牧"
 building_UBA_pasture_02_desc:0 "为了追逐更优质的牧草和水源，我们会根据季节的变化和不同牧场的环境特点，调整五畜的比例，将牲畜迁徙到最适宜放牧的区域，从而让牧群保持增长。"
 building_UBA_pasture_03:0 "水源维护"
 building_UBA_pasture_03_desc:0 "草原上的水源至关重要。我们开始维护和疏浚天然的水源地，挖掘简易的水井，确保在旱季也能为牲畜提供充足的饮水。"
 building_UBA_pasture_04:0 "五畜控制"
 building_UBA_pasture_04_desc:0 "牧场被划分为若干区域，牲畜在不同区域轮流放牧，使植被得以恢复，维持草场的肥力。我们还会考察不同草场的承载能力和适宜放牧的牲畜种类，从而调整五畜的比例，以适应不同的环境。"
 building_UBA_pasture_05:0 "牲畜棚圈"
 building_UBA_pasture_05_desc:0 "在极端天气或疾病流行时期，这些牲畜棚圈能够为牲畜提供庇护，减少损失。平时储备的干草和饲料也能在自然条件不佳的时期确保牲畜数量的稳定。"
 UBA_pasture_building:0 "有正在建造中的$building_type_UBA_pasture_01$"
 UBA_pasture_finished:0 "已建成完美的$building_type_UBA_pasture_01$"
 UBA_pasture_unlocks_desc:0 "$UBA_hunting_unlocks_desc$"
# 王庭
 building_type_UBA_yurt_01:0 "汗王庭"
 building_type_UBA_yurt_01_desc:0 "$building_UBA_yurt_05_desc$"
 building_UBA_yurt_01:0 "可汗营帐"
 building_UBA_yurt_01_desc:0 "可汗的大帐是一个选址考究、相对固定的居所，更是草原权力的中心。可汗的命令自此传遍草原，可汗的臣属在此宣誓忠诚。"
 building_UBA_yurt_02:0 "部族集会"
 building_UBA_yurt_02_desc:0 "随着势力的扩张，可汗的大帐周围聚集了更多部族的代表和武士。此地逐渐成为了各部族的集会地，时常举行重要的仪式、商议军事行动和接收臣属的贡品。"
 building_UBA_yurt_03:0 "怯薛大营"
 building_UBA_yurt_03_desc:0 "可汗的王庭周围构筑起更加坚固的防御工事，而可汗的亲卫也驻扎在大帐周围的营地中，他们足以让任何潜在的反叛者打消不敬的念头。草原上每一个部族都将匍匐在大汗脚下。"
 building_UBA_yurt_04:0 "觐见大厅"
 building_UBA_yurt_04_desc:0 "宏伟华丽的觐见厅已然落成，附庸国和朝贡国的使节得以在此谒见大汗。来者或是被大汗的威严与财富震撼，或是被亲卫的刀兵吓破胆，再无反叛的念头。"
 building_UBA_yurt_05:0 "可汗之座"
 building_UBA_yurt_05_desc:0 "王庭正是草原上无可争议的权力中心。坚固的防御工事、庞大的军事力量和完善的管理机构，使得大汗能够有效地控制他治下的广阔领土和众多臣属。来自各地的使节和贡品络绎不绝，大汗的权威至高无上。"
