 building_type_UBA_wonderful_mines_01:0 "神秘矿区"
 building_type_UBA_wonderful_mines_01_desc:0 "“谁又能知晓这片土地上究竟埋藏着多么奇妙的宝藏呢？或许我们所渴求的财富此刻正潜藏在我们脚底。”"
 building_UBA_wonderful_mines_01:0 "神秘矿洞"
 building_UBA_wonderful_mines_01_desc:0 "一处近日才被发现的奇怪矿洞。我们尚未探明这处矿藏是否有开采的价值。"
 building_UBA_wonderful_mines_02:0 "大矿洞：铁矿"
 building_UBA_wonderful_mines_02_desc:0 "一处出产铁的矿洞。数十个村庄已经围绕着初始的矿洞建立起来。这处矿区开始小规模生产以铁矿石为主，偶尔也能发现锡、铅等金属的矿石。"
 building_UBA_wonderful_mines_03:0 "大矿井：铜矿"
 building_UBA_wonderful_mines_03_desc:0 "一处出产各类金属的矿洞。除了铁、锡、铅等各类金属之外，矿工还发现了易于开采的铜矿脉——很快这里就能开采出大量铜矿石。"
 building_UBA_wonderful_mines_04:0 "大矿井：银矿"
 building_UBA_wonderful_mines_04_desc:0 "随着定居者的增长，人们对这处矿井的了解更加深入：这里几乎能够找到任何金属，并且矿层分隔方式明晰，储量非常庞大。更值得一提的是，这里还开采出了珍贵的白银！"
 building_UBA_wonderful_mines_05:0 "大矿井：金矿"
 building_UBA_wonderful_mines_05_desc:0 "种种因素都表明，这是一处奇迹般的金属矿藏，矿藏品类丰富且质量优秀。在发现金矿的消息传出后，合格的工程师大量涌入，使得建设一个真正意义上的矿场得以实现。"
 building_UBA_wonderful_mines_06:0 "大矿场：宝石"
 building_UBA_wonderful_mines_06_desc:0 "随着开采规模越来越大，更多的矿脉入口被我们打通，巨型竖井也被挖掘完成以开采更深处的矿藏。工人们开始时常发现各色大型宝石，矿区引入了更多工程师以增加宝石开采量。"
 building_UBA_wonderful_mines_07:0 "大矿业综合体"
 building_UBA_wonderful_mines_07_desc:0 "随着采矿量与矿产种类的不断增加，数座冶炼厂和铸造厂在定居点附近被建立起来，工人的总规模也接近上万。不仅如此，宝石的开采也近乎达到了工业规模，吸引来了世界各地的工匠和商人，这将为我们带来难以想象的财富。"
 building_UBA_wonderful_mines_08:0 "矿业之都"
 building_UBA_wonderful_mines_08_desc:0 "无尽的财富正不断从矿井中喷涌而出，让这座昔日默默无闻的市镇如今声名远播。而在诗人口中，它的名字已与财富同义。"


