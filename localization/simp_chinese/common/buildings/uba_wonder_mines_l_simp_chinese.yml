l_simp_chinese:
 building_type_UBA_gems_mines_01:0 "宝石矿"
 building_type_UBA_gems_mines_01_desc:0 "过去的数百年中无人知晓这些美丽的宝石蕴藏在这里的地层之下。而如今，无数宝藏正等待着我们去开采。"
 building_UBA_gems_mines_01:0 "宝石矿坑"
 building_UBA_gems_mines_01_desc:0 "$building_type_UBA_gems_mines_01_desc$"
 building_UBA_gems_mines_02:0 "宝石矿井"
 building_UBA_gems_mines_02_desc:1 "矿坑得到扩建，引进了能真正增加宝石开采量的工程师。"
 building_UBA_gems_mines_03:0 "宝石大矿井"
 building_UBA_gems_mines_03_desc:0 "众多矿坑围绕着一座村庄建起，工人们时常会发现大型宝石。"
 building_UBA_gems_mines_04:0 "宝石矿业综合体"
 building_UBA_gems_mines_04_desc:0 "宝石的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"

 building_type_UBA_diamonds_mines_01:0 "钻石矿"
 building_type_UBA_diamonds_mines_01_desc:0 "虽然这些漂亮的宝石需要经过切割才能焕发出美丽的光彩，它将为我们带来难以想象的财富。"
 building_UBA_diamonds_mines_01:0 "钻石矿坑"
 building_UBA_diamonds_mines_01_desc:0 "仅是黏土和沙砾的坑洞，身缠腰布的工人在此日夜辛劳以开采钻石。"
 building_UBA_diamonds_mines_02:0 "钻石矿井"
 building_UBA_diamonds_mines_02_desc:1 "矿坑得到扩建，引进了能真正增加钻石开采量的工程师。"
 building_UBA_diamonds_mines_03:0 "钻石大矿井"
 building_UBA_diamonds_mines_03_desc:0 "众多矿坑围绕着一座村庄建起，工人们时常会发现大型钻石。"
 building_UBA_diamonds_mines_04:0 "钻石矿业综合体"
 building_UBA_diamonds_mines_04_desc:0 "钻石的开采近乎达到了工业规模，工人的规模也有数千。无尽的财富不断从矿井中涌出。"

 building_type_UBA_jade_mines_01:0 "大玉矿"
 building_type_UBA_jade_mines_01_desc:0 "此地盛产大量的玉石，既可直接从山中开采，也可自露天矿坑与河床直接采集。"
 building_UBA_jade_mines_01:0 "采矿点"
 building_UBA_jade_mines_01_desc:0 "$building_type_UBA_jade_mines_01_desc$"
 building_UBA_jade_mines_02:0 "矿井"
