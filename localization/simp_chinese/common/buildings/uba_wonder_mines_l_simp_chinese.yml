 building_UBA_salt_mines_04:0 "矿业综合体"
 building_UBA_salt_mines_04_desc:0 "$building_taghaza_mines_04_desc$"

 building_type_UBA_gold_mines_01:0 "大金矿"
 building_type_UBA_gold_mines_01_desc:0 "没有人会拒绝这些如太阳般闪耀的东西，而这一区域恰好能开采出这种珍贵的金属。"
 building_UBA_gold_mines_01:0 "矿坑"
 building_UBA_gold_mines_01_desc:0 "$building_type_UBA_gold_mines_01_desc$"
 building_UBA_gold_mines_02:0 "矿井"
 building_UBA_gold_mines_02_desc:1 "随着定居者的增长，越来越多的矿石被开采。源源加入的合格的工程师使得一个真正意义上的矿场的建设得以实现。"
 building_UBA_gold_mines_03:0 "大矿井"
 building_UBA_gold_mines_03_desc:0 "随着开采的增长，矿场也在发展。越来越多的入口被建设起来，巨型竖井也被挖掘完成以开采深矿。"
 building_UBA_gold_mines_04:0 "矿业综合体"
 building_UBA_gold_mines_04_desc:0 "随着采矿量的增加，一些冶炼厂和铸造厂也在定居点附近被建立起来。加工金属已经成为了这里居民的第二天性，他们的技艺举世皆知。"

 building_type_UBA_silver_mines_01:0 "大银矿"
 building_type_UBA_silver_mines_01_desc:0 "这座庞大的银矿床意味着机遇，意味着有许多人会被吸引到这一区域。"
 building_UBA_silver_mines_01:0 "矿坑"
 building_UBA_silver_mines_01_desc:0 "$building_type_UBA_silver_mines_01_desc$"
 building_UBA_silver_mines_02:0 "矿井"
 building_UBA_silver_mines_02_desc:1 "随着定居者的增长，越来越多的矿石被开采。源源加入的合格的工程师使得一个真正意义上的矿场的建设得以实现。"
 building_UBA_silver_mines_03:0 "大矿井"
 building_UBA_silver_mines_03_desc:0 "随着开采的增长，矿场也在发展。越来越多的入口被建设起来，巨型竖井也被挖掘完成以开采深矿。"
 building_UBA_silver_mines_04:0 "矿业综合体"
 building_UBA_silver_mines_04_desc:0 "随着采矿量的增加，一些冶炼厂和铸造厂也在定居点附近被建立起来。加工金属已经成为了这里居民的第二天性，他们的技艺举世皆知。"

 building_type_UBA_copper_mines_01:0 "大铜矿"
 building_type_UBA_copper_mines_01_desc:1 "几乎没有任何一处铜矿藏能像此处矿脉一般丰富，很快这里就会开始生产数量惊人的铜矿石。"
 building_UBA_copper_mines_01:1 "采矿点"
 building_UBA_copper_mines_01_desc:1 "一个小的矿业居民点在矿脉附近建立了起来。定居者已经开始开采矿脉提取矿石，但到目前为止，还只能采到地表的矿。"
 building_UBA_copper_mines_02:1 "矿井"
 building_UBA_copper_mines_02_desc:1 "随着采矿点的扩大，越来越多的矿石被开采出来。合格的工程师大量涌入，使得建设一个真正意义上的矿场得以实现。"
 building_UBA_copper_mines_03:1 "大矿井"
 building_UBA_copper_mines_03_desc:1 "随着开采规模越来越大，更多的矿脉入口被我们打通，我们更在矿洞中建立起大型竖井，让工人们得以开采出更深处的矿石。"
 building_UBA_copper_mines_04:1 "矿业综合体"
 building_UBA_copper_mines_04_desc:1 "随着采矿量的增加，一些冶炼厂和铸造厂也在定居点附近被建立起来。加工金属已经成为了这里居民的第二天性，他们的技艺举世皆知。"

 building_type_UBA_iron_mines_01:0 "大铁矿"
 building_type_UBA_iron_mines_01_desc:0 "矿工们用鲜血与汗水换来了这些不起眼的金属，它们很快就会被锻造成强大的武器。"
 building_UBA_iron_mines_01:0 "采矿点"
 building_UBA_iron_mines_01_desc:0 "$building_type_UBA_iron_mines_01_desc$"
 building_UBA_iron_mines_02:0 "矿井"
 building_UBA_iron_mines_02_desc:1 "随着采矿点的扩大，越来越多的矿石被开采出来。合格的工程师大量涌入，使得建设一个真正意义上的矿场得以实现。"
 building_UBA_iron_mines_03:0 "大矿井"
 building_UBA_iron_mines_03_desc:0 "随着开采规模越来越大，更多的矿脉入口被我们打通，我们更在矿洞中建立起大型竖井，让工人们得以开采出更深处的矿石。"
 building_UBA_iron_mines_04:0 "矿业综合体"
 building_UBA_iron_mines_04_desc:0 "随着采矿量的增加，一些冶炼厂和铸造厂也在定居点附近被建立起来。加工金属已经成为了这里居民的第二天性，他们的技艺举世皆知。"

