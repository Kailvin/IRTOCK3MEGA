 building_UBA_jade_mines_03:0 "大矿井"
 building_UBA_jade_mines_03_desc:0 "$building_hetian_mines_03_desc$"
 building_UBA_jade_mines_04:0 "矿业综合体"
 building_UBA_jade_mines_04_desc:0 "$building_hetian_mines_04_desc$"

 building_type_UBA_salt_mines_01:0 "大盐矿"
 building_type_UBA_salt_mines_01_desc:0 "没有人可以在完全不摄入盐的情况下存活，矿场和盐市成为了该地区一个重要的收入来源。"
 building_UBA_salt_mines_01:0 "采矿点"
 building_UBA_salt_mines_01_desc:0 "$building_type_UBA_salt_mines_01_desc$"
 building_UBA_salt_mines_02:0 "矿井"
 building_UBA_salt_mines_02_desc:1 "$building_taghaza_mines_02_desc$"
