## 开局规则设置
 rule_uba_decision_cooldown_set:0 "#high 建筑师：#! 冷却时间"
 setting_uba_decision_cooldown_no:0 "无冷却"
 setting_uba_decision_cooldown_no_desc:0 "$great_project_type_uba_construct_wonder$[great_project|E]没有冷却。"
 setting_uba_decision_cooldown_default:0 "默认"
 setting_uba_decision_cooldown_default_desc:0 "每五年可进行一次$great_project_type_uba_construct_wonder$[great_project|E]。"
 setting_uba_decision_cooldown_less:0 "#high 更短 #!"
 setting_uba_decision_cooldown_less_desc:0 "每两年可使用一次$great_project_type_uba_construct_wonder$[great_project|E]。"
 setting_uba_decision_cooldown_more:0 "#high 更长 #!"
 setting_uba_decision_cooldown_more_desc:0 "每十年可使用一次$great_project_type_uba_construct_wonder$[great_project|E]。"
 setting_uba_decision_cooldown_much_more:0 "#high 超长 #!"
 setting_uba_decision_cooldown_much_more_desc:0 "每二十年可使用一次$great_project_type_uba_construct_wonder$[great_project|E]。"

 rule_uba_decision_cost_set:0 "#high 建筑师：#! 建设花费"
 setting_uba_decision_cost_default:0 "默认"
 setting_uba_decision_cost_default_desc:0 "$great_project_type_uba_construct_wonder$[great_project|E]需要花费2000[gold|E]。"
 setting_uba_decision_cost_less:0 "#high 更少 #!"
 setting_uba_decision_cost_less_desc:0 "$great_project_type_uba_construct_wonder$[great_project|E]需要花费1000[gold|E]。"
 setting_uba_decision_cost_more:0 "#high 加倍 #!"
 setting_uba_decision_cost_more_desc:0 "$great_project_type_uba_construct_wonder$[great_project|E]需要花费4000[gold|E]。"
 setting_uba_decision_cost_much_more:0 "#high 超级加倍 #!"
 setting_uba_decision_cost_much_more_desc:0 "$great_project_type_uba_construct_wonder$[great_project|E]需要花费8000[gold|E]。"

 rule_uba_common_buildings_switch:0 "#high 建筑师：#! 模组通用建筑"
 setting_uba_common_buildings_on:0 "启用"
 setting_uba_common_buildings_on_desc:0 "MOD增加的通用建筑将可用。"
 setting_uba_common_buildings_off:0 "#color_red 关闭 #!"
 setting_uba_common_buildings_off_desc:0 "MOD增加的通用建筑将#color_red 不再可用#!。"

 rule_uba_wonder_buildings_unique_switch:0 "#high 建筑师：#! 模组奇观独一性"
 setting_uba_wonder_buildings_unique_on:0 "启用"
 setting_uba_wonder_buildings_unique_on_desc:0 "每种MOD增加的奇观建筑将只有一个可升到满级。"
 setting_uba_wonder_buildings_unique_off:0 "#color_green 无限制 #!"
 setting_uba_wonder_buildings_unique_off_desc:0 "任何MOD增加的奇观建筑都可升到满级，不再拥有限制。"

 rule_uba_history_special_buildings:0 "#high 建筑师：#! 模组历史特殊建筑"
 setting_uba_history_special_buildings_on:0 "启用"
 setting_uba_history_special_buildings_on_desc:0 "MOD增加的历史特殊建筑将可用。"
 setting_uba_history_special_buildings_off:0 "#color_red 关闭 #!"
 setting_uba_history_special_buildings_off_desc:0 "MOD增加的历史特殊建筑将#color_red 不再可用#!。"

 rule_uba_innovation_requirement:0 "#high 建筑师：#! 特建升级要求"
 setting_uba_innovation_requirement_on:0 "默认"
 setting_uba_innovation_requirement_on_desc:0 "MOD增加的特殊建筑升级时将会有革新要求。"
 setting_uba_innovation_requirement_off:0 "#color_green 无要求 #!"
 setting_uba_innovation_requirement_off_desc:0 "MOD增加的特殊建筑升级时不再需要特定革新。"

