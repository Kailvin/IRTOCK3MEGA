l_simp_chinese:
# 游牧建筑升级
 uba_nomadic_decisions.0001.t:0 "建筑规划：草原之上"
 uba_nomadic_decisions.0001.desc:0 "在草原上建设的这座建筑已经显得有些渺小而过时了……这种东西无法满足我的期望！\n\n无人能够否认我统治这片土地的神圣权利，而这座建筑将使之成为永恒的印记。\n\n我必须立刻召集我所能找到的任何工匠来继续完成这一宏伟的计划！"
 uba_nomadic_decisions.0001.a:0 "马上开工！"

 uba_remove_decisions.0001.t:0 "建造奇观：清理场地"
 uba_remove_decisions.0001.desc:0 "工匠已经准备就绪，时刻可以开始工作，拆除这座曾经闻名四方的建筑物。\n\n啊……想想吧，一座更伟大的建筑即将在它的旧址上落成，彰显我的权力与荣耀！"
 uba_remove_decisions.0001.a:0 "或许我会想念它的。"
 uba_remove_decisions.0001.a.flavor:0 "此地的特殊建筑将被拆除。\n\n如果后悔的话，你仍然可以花更大价钱重建这座建筑。"

uba_decisions.0001.t: "建造奇观：选址"
uba_decisions.0001.desc: "站在[uba_building_locale.GetName]的高处，我能够清晰地看到四周的景色。\n\n在四处张望的时候，我突然意识到远处有块不错的空地：那里地势平坦，便于施工，交通也还算便利，似乎是个合适的选址位置。"
uba_decisions.0001.a: "那就如此决定了。"
uba_decisions.0001.a_tt: "你选定了[uba_building_locale.GetNameNoTooltip]作为未来建筑工程的地点"
uba_decisions.0001.cancel: "或许不是个好主意。"
uba_decisions.0001.cancel_tt: "你默默打消了在[uba_building_locale.GetNameNoTooltip]开展建设的想法"

uba_decisions.0999.t: "世间奇观：[uba_building_province.GetNameNoTooltip]"
uba_decisions.0999.desc: "跨越了数十年乃至数百年的时光，我的梦想终于成为了现实：\n\n[uba_building_province.GetName]的伟大奇观如今已成为了它的重要标识，吸引了无数慕名前来的游客和学者，没有人不想知道如此伟大的奇迹是出自谁人之手！\n\n现如今，每个人都会记得[ROOT.Char.GetDynasty.GetName]的名号。"
uba_decisions.0999.a: "大功告成。"
uba_decisions.0999.a.flavor: "$trait_architect_desc$"

uba_decisions.0998.t: "$building_UBA_secret_05$：[uba_building_province.GetNameNoTooltip]"
uba_decisions.0998.desc: "跨越了数十年乃至数百年的时光，我的梦想终于成为了现实：\n\n[uba_building_province.GetName]的秘密宫殿如今彻底建成……它将会成为我的秘密藏身地，也是我搅动风云的中枢。\n\n现如今，每个人都会畏惧[ROOT.Char.GetDynasty.GetName]的名号。"

# 1000 工程
uba_decisions.1000.t:0 "建筑规划：$uba_building_decision_wall$"
uba_decisions.1000.desc:0 "我的生命总有一天会抵达终点，但这座出自我手的建筑会见证我身后的风云变幻。接下来的问题就是：\n\n是什么让我值得被世人铭记？"
uba_decisions.1000.achievement:0 "我的功绩足以作答。"
uba_decisions.1000.achievement.flavor:0 "你考虑建设一座彰显你功绩的建筑"
uba_decisions.1000.wall:0 "我的城墙将世代守护人民。"
uba_decisions.1000.wall.flavor:0 "你考虑建设一道$building_type_UBA_wall_01$"
uba_decisions.1000.test:0 "……只是测试一下。"
uba_decisions.1000.test.flavor:0 "你决定在这里建造一座测试用建筑"
uba_decisions.1000.back:0 "……或许这不是好主意。"
uba_decisions.1000.back.flavor:0 "于是你默默放弃了这个想法"
uba_decisions.1000.cancel:0 "……或许我该重新选个地方。"
uba_decisions.1000.cancel.flavor:0 "于是你默默打消了在[ROOT.Var('uba_building_location').Province.GetNameNoTooltip]开展建设的想法"
# 1001 成就建筑
uba_decisions.1001.t:0 "建筑规划：为历史所铭记"
uba_decisions.1001.desc:0 "并非我#EMP 希望#!被历史铭记，而是历史#EMP 应当#!铭记我！\n\n我的功绩#EMP 已然#!超过了无数不起眼的小人物；\n我#EMP 已经#!在这个世界上留下了浓墨重彩的一笔；\n而我#EMP 将要#!让这个世界永远记得我的名号："
uba_decisions.1001.a:0 "我乃北海至高王，马恩岛及群岛的领主"
uba_decisions.1001.a.flavor:0 "“统一北境之王，征服北海之主，铸就至高王座之人”"
uba_decisions.1001.a.tt:0 "你将能够启动建造$great_project_type_uba_construct_valhalla$的[great_project|E]"
uba_decisions.1001.b:0 "我乃海外的君主，十字军的统帅"
uba_decisions.1001.b.flavor:0 "“吾主的至圣十字架将从此海树立至彼海”"
uba_decisions.1001.b.tt:0 "你将能够启动建造$great_project_type_uba_construct_headquarter$的[great_project|E]"
uba_decisions.1010.t:0 "血与金之城"
uba_decisions.1010.desc.pagan:0 "多年以来，我自七海之上掠夺了无数财富，将他们堆积在我的高墙之内。如今，我需要一座更加宏伟的城池来容纳这些财宝。\n\n这座城池应当宛如地上的瓦尔哈拉，我将以此号召所有的维京勇士为我而战——为那七海之内一切#EMP 财富#!与#EMP 荣耀#!而战。此乃奥丁的旨意。\n\n这座城池，将夺走并收拢起天下一切财宝；\n这座城池，将在吟游诗人的曲中名扬天下；\n这座城池，将与[ROOT.Char.GetHouse.GetBaseNameNoTooltip][ROOT.Char.GetTitleAsNameNoTooltip]之名永存！"
uba_decisions.1010.desc.else:0 "多年以来，我自七海之上掠夺了无数财富，将他们堆积在我的高墙之内。如今，我需要一座更加宏伟的城池来容纳这些财宝。\n\n这座城池将永远矗立于北海之滨，吸引无数的勇者为我而战——为#EMP 财富#!与#EMP 荣耀#!而战。\n\n这座城池，将夺走并收拢起天下一切财宝；\n这座城池，将在吟游诗人的曲中名扬天下；\n这座城池，将与[ROOT.Char.GetHouse.GetBaseNameNoTooltip][ROOT.Char.GetTitleAsNameNoTooltip]之名永存！"
uba_decisions.1010.a:0 "北海雄主之名永存于世！"
uba_decisions.1010.a.flavor:0 "你的名号万人称颂，你的功绩万古长存。"
uba_decisions.1011.t:0 "十字军之城"
uba_decisions.1011.desc:0 "终于，一个真正的圣地！黄金十字架的光辉从亚实基伦照耀到奥马尔，异教徒全部被驱逐出圣地。\n\n这座城池将永远矗立于海外，吸引无数的战士为此而战——为#EMP 信仰#!与#EMP 荣耀#!而战。\n\n这座城池，将与[ROOT.Char.GetFaith.HighGodName]之名永存！"
uba_decisions.1011.a:0 "以神之名！"
uba_decisions.1011.a.flavor:0 "上主，光荣不要归于我们，不要归于我们，只愿光荣完全归于你的圣名。"
# 1100 城墙
uba_decisions.1100.t:0 "建筑规划：$building_type_UBA_wall_01$"
uba_decisions.1100.desc:0 "我将建起一道坚固的城墙，它能够保护我的子民，泽及万世。\n\n作为一位永恒的守护者、一座不朽的纪念碑，它将用自己的身躯抵挡无数的风雨和战火，保卫一代代人民。"
uba_decisions.1100.a:0 "就是这样。"
uba_decisions.1100.a_tt:0 "你将能够启动建造$great_project_type_uba_construct_wall$的[great_project|E]"
uba_decisions.1100.back:0 "$uba_decisions.1000.back$"
uba_decisions.1100.back.flavor:0 "$uba_decisions.1000.back.flavor$"
# 1999 测试
uba_decisions.1999.t:0 "建筑规划：测试"
uba_decisions.1999.desc:0 "在目标位置建设一座测试建筑"
uba_decisions.1999.a:0 "就是这样。"
uba_decisions.1999.a_tt:0 "在目标位置建设一座测试建筑"

# 2000 外交 
 uba_decisions.2000.t:0 "建筑规划：$uba_building_decision_diplomacy$"
 uba_decisions.2000.desc:0 "我的生命总有一天会抵达终点，但这座出自我手的建筑会见证我身后的风云变幻。\n\n无人能够否认我统治这片土地的神圣权利，而这座建筑将使之成为永恒的印记。我将建立一座……"
 uba_decisions.2000.colosseum:0 "……胜过世间的剧场。"
 uba_decisions.2000.colosseum.flavor:0 "你考虑建设一座$building_type_UBA_colosseum_01$"
 uba_decisions.2000.palace:0 "……宏伟壮丽的宫殿。"
 uba_decisions.2000.palace.flavor:0 "你考虑建设一座$building_type_UBA_palace_01$"
 uba_decisions.2000.reserve:0 "……由我独享的林苑。"
 uba_decisions.2000.reserve.flavor:0 "你考虑建设一座$building_type_UBA_reserve_01$"
 uba_decisions.2100.t:0 "建筑规划：$building_type_UBA_colosseum_01$"
 uba_decisions.2100.desc:0 "我将建起一座举世无双的剧场，让大理石化作美妙的奇迹。\n\n戏剧与音乐的艺术以其非同一般的魅力吸引着万千的目光，而这座剧场则支撑着无数舞台上的欢笑与梦想。"
 uba_decisions.2100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.2100.a_tt:0 "一项宏伟的建筑工程即将展开，而我需要选择一处合适的地点。"
 uba_decisions.2200.t:0 "建筑规划：$building_type_UBA_palace_01$"
 uba_decisions.2200.desc:0 "我将建立起一座富丽堂皇的宫殿，向世人展现我统治的伟大。\n\n宫殿的高墙将会见证百千年的兴衰迭起，而那宏伟的穹顶则如我的荣耀与梦想，始终屹立于历史的风云中。"
 uba_decisions.2200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.2200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.2300.t:0 "建筑规划：$building_type_UBA_reserve_01$"
 uba_decisions.2300.desc:0 "我将建立起一座举世无双的林苑，全世界都会为它的美丽而感叹。\n\n山川树木与宫阙楼阁相辅相成，造就了这世间罕有的奢华园林。"
 uba_decisions.2300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.2300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 3000 军事
 uba_decisions.3000.t:0 "建筑规划：$uba_building_decision_martial$"
 uba_decisions.3000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.3000.castle:0 "……固若金汤的要塞。"
 uba_decisions.3000.castle.flavor:0 "你考虑建设一座$building_type_UBA_castle_01$"
 uba_decisions.3000.tower:0 "……宏伟高大的巨塔。"
 uba_decisions.3000.tower.flavor:0 "你考虑建设一座$building_type_UBA_tower_01$"
 uba_decisions.3000.knight:0 "……无上荣耀的军校。"
 uba_decisions.3000.knight.flavor:0 "你考虑建设一座$building_type_UBA_knight_01$"
 uba_decisions.3100.t:0 "建筑规划：$building_type_UBA_castle_01$"
 uba_decisions.3100.desc:0 "我将建立起一座固若金汤的要塞，向世人展现我的力量与决心。\n\n这座堡垒将会守护一代代领主的荣光和人民的安宁，见证无数骑士与将军建立的功勋。"
 uba_decisions.3100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.3100.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.3200.t:0 "建筑规划：$building_type_UBA_tower_01$"
 uba_decisions.3200.desc:0 "我将建立起一座高耸入云的巨塔，确保领地在我的控制之下。\n\n一座令人敬畏的塔楼不但能够提防潜在入侵者的攻击，还能为行人指引方位。"
 uba_decisions.3200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.3200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.3300.t:0 "建筑规划：$building_type_UBA_knight_01$"
 uba_decisions.3300.desc:0 "我将建立起一座无上荣耀的军校，为我的军队培育更多勇猛的战士。\n\n无数骑士与军官会从这里走向战场，它的名声将令我的敌人胆寒。"
 uba_decisions.3300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.3300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 4000 管理
 uba_decisions.4000.t:0 "建筑规划：$uba_building_decision_stewardship$"
 uba_decisions.4000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.4000.governor:0 "……明断是非的法院。"
 uba_decisions.4000.governor.flavor:0 "你考虑建设一座$building_type_UBA_governor_01$"
 uba_decisions.4000.workshop:0 "……技艺超群的工坊。"
 uba_decisions.4000.workshop.flavor:0 "你考虑建设一座$building_type_UBA_workshop_01$"
 uba_decisions.4000.parliament:0 "……共商国是的议会。"
 uba_decisions.4000.parliament.flavor:0 "你考虑建设一座$building_type_UBA_parliament_01$"
 uba_decisions.4100.t:0 "建筑规划：$building_type_UBA_governor_01$"
 uba_decisions.4100.desc:0 "我将建立起一座总理司法的法院，以确保于我统治下的公平与正义。\n\n审判是为了让正义降临到这片广袤的领土，以及土地上的每个人身边。这套系统将长久运行下去，直到世界末日。"
 uba_decisions.4100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.4100.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.4200.t:0 "建筑规划：$building_type_UBA_workshop_01$"
 uba_decisions.4200.desc:0 "我将建立起一座工匠云集的工坊，技艺超群的工匠才是领地兴盛的证明。\n\n精巧的设备与工具将会成为此地的名片，让工艺之城的名声远播海外。"
 uba_decisions.4200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.4200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.4300.t:0 "建筑规划：$building_type_UBA_parliament_01$"
 uba_decisions.4300.desc:0 "我将建立起一座海纳百川的议会，让我的领民与封臣共商国是。\n\n贵族、神职与市民的代表将齐聚一堂，商讨国家的方方面面。而以此为基础建立起来的全新制度将会让我的国度在接下来的千百年中显得如此不同。"
 uba_decisions.4300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.4300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 5000 谋略
 uba_decisions.5000.t:0 "建筑规划：$uba_building_decision_intrigue$"
 uba_decisions.5000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.5000.secret:0 "……无人知晓的藏身处"
 uba_decisions.5000.secret.flavor:0 "你考虑建设一座$building_type_UBA_secret_01$"
 uba_decisions.5100.t:0 "建筑规划：$building_type_UBA_secret_01$"
 uba_decisions.5100.desc:0 "我将建立起一座隐秘而不可知的宫殿，而我将以此建立起我在阴影中的帝国……\n\n我会确保无关人士不会知晓这座秘密宫殿的存在，即便是参与建造的工匠和臣仆也不能活着离开。"
 uba_decisions.5100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.5100.a_tt:0 "$uba_decisions.2100.a_tt$"
# 6000 学识
 uba_decisions.6000.t:0 "建筑规划：$uba_building_decision_learning$"
 uba_decisions.6000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.6000.hospital:0 "……救死扶伤的医院。"
 uba_decisions.6000.hospital.flavor:0 "你考虑建设一座$building_type_UBA_hospital_01$"
 uba_decisions.6000.university:0 "……传道授业的大学。"
 uba_decisions.6000.university.flavor:0 "你考虑建设一座$building_type_UBA_university_01$"
 uba_decisions.6000.church:0 "……宏伟庄严的圣殿。"
 uba_decisions.6000.church.flavor:0 "你考虑建设一座$building_type_UBA_church_01$"
 uba_decisions.6100.t:0 "建筑规划：$building_type_UBA_hospital_01$"
 uba_decisions.6100.desc:0 "我将建立起一座救死扶伤的医院，以确保瘟疫不能危害我统治与我的臣民。\n\n圣洁而虔诚的人们将在此照顾病弱伤残之人，让受苦受难之人存有活下去的希望。"
 uba_decisions.6100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.6100.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.6200.t:0 "建筑规划：$building_type_UBA_university_01$"
 uba_decisions.6200.desc:0 "我将建立起一座学者云集的大学，来自世界各地的知识皆能汇聚于此。\n\n它将是知识的殿堂、文化的摇篮。灵感将在这里互相碰撞，摩擦出耀眼的火花。"
 uba_decisions.6200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.6200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.6300.t:0 "建筑规划：$building_type_UBA_church_01$"
 uba_decisions.6300.desc:0 "我将建立起一座宏伟壮丽的圣殿，而我将这座伟大的建筑献给神。\n\n一座壮丽的圣堂会吸引来各方的信徒前来瞻仰，他们将在此处祈求神的庇护，感受神的注视。"
 uba_decisions.6300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.6300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 7000 旅行
 uba_decisions.7000.t:0 "建筑规划：$uba_building_decision_travel$"
 uba_decisions.7000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.7000.market:0 "……商贾云集的市场。"
 uba_decisions.7000.market.flavor:0 "你考虑建设一座$building_type_UBA_market_01$"
 uba_decisions.7000.port:0 "……舟楫云集的港口。"
 uba_decisions.7000.port.flavor:0 "你考虑建设一座$building_type_UBA_port_01$"
 uba_decisions.7000.holyland:0 "……信仰多元的圣地。"
 uba_decisions.7000.holyland.flavor:0 "你考虑建设一座$building_type_UBA_holyland_01$"
 uba_decisions.7000.basins:0 "……泽被后世的水库。"
 uba_decisions.7000.basins.flavor:0 "你考虑建设一座$building_type_UBA_basins_01$"
 uba_decisions.7100.t:0 "建筑规划：贸易站"
 uba_decisions.7100.desc.market:0 "我将建立起一座商贾云集的市场，汇集全世界的珍奇异宝。\n\n来自天南海北的货物，少有人见识过的货币以及人世间的一切财富都会在这里汇聚。"
 uba_decisions.7100.market:0 "$uba_decisions.1100.a$"
 uba_decisions.7100.market_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.7100.desc.port:0 "我将建立起一座舟楫云集的港口，贸易路线中的明珠。\n\n这座港口与城市融为一体，来往船舶络绎不绝。它承载了无数个梦想，见证了无数段人生。"
 uba_decisions.7100.port:0 "$uba_decisions.1100.a$"
 uba_decisions.7100.port_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.7200.t:0 "建筑规划：$building_type_UBA_holyland_01$"
 uba_decisions.7200.desc:0 "我将实践一条世人未曾设想过的道路，来自世界各地的信徒们皆能汇聚于此……\n\n……但他们不会相互争斗，而是尊重彼此的信仰。他们将为各自祈求祝福，消弭痛苦，在人世间散播和平之种。\n\n这或许很难，但我们可以尝试。"
 uba_decisions.7200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.7200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.7300.t:0 "建筑规划：$building_type_UBA_basins_01$"
 uba_decisions.7300.desc:0 "我将建立起一座泽被后世的水库，在降低洪水威胁的同时保障附近地区的用水。\n\n完善的水库和水道系统能够精确控制水流，最大限度地利用水资源，让我的领地更加繁荣。"
 uba_decisions.7300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.7300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 8000 生活
 uba_decisions.8000.t:0 "建筑规划：$uba_building_decision_lifestyle$"
 uba_decisions.8000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.8000.academy:0 "……卷帙浩繁的书库。"
 uba_decisions.8000.academy.flavor:0 "你考虑建设一座$building_type_UBA_academy_01$"
 uba_decisions.8000.garden:0 "……生机勃勃的花园。"
 uba_decisions.8000.garden.flavor:0 "你考虑建设一座$building_type_UBA_garden_01$"
 uba_decisions.8000.hunting:0 "……野性盎然的猎场。"
 uba_decisions.8000.hunting.flavor:0 "你考虑建设一座$building_type_UBA_hunting_01$"
 uba_decisions.8100.t:0 "建筑规划：$building_type_UBA_academy_01$"
 uba_decisions.8100.desc:0 "我将建立起一座卷帙浩繁的图书馆，以确保知识得以传承。\n\n它将是知识的殿堂、文化的摇篮。她藏书无数，超过亚历山大图书馆；她知识广博，胜过巴格达的智慧宫。"
 uba_decisions.8100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.8100.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.8200.t:0 "建筑规划：$building_type_UBA_garden_01$"
 uba_decisions.8200.desc:0 "我将建立起一座震撼人心的花园，呈现艺术家梦中的风景。\n\n这座奇迹般的花园将搜罗世界各地的奇花异草，即便四季流转也不能损害它的美丽。相比之下，即便是巴比伦与波斯的古老奇迹也会黯然失色。"
 uba_decisions.8200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.8200.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.8300.t:0 "建筑规划：$building_type_UBA_hunting_01$"
 uba_decisions.8300.desc:0 "我将划定一片野性盎然的猎场，将附近未经开发的土地全数圈入其中。\n\n狩猎的配套设施将被设置在猎场边缘，甚至包括一套豪华别墅，这会让狩猎成为一种奢侈的享受。"
 uba_decisions.8300.a:0 "$uba_decisions.1100.a$"
 uba_decisions.8300.a_tt:0 "$uba_decisions.2100.a_tt$"
# 9000 游牧
 uba_decisions.9000.t:0 "建筑规划：$uba_building_decision_lifestyle$"
 uba_decisions.9000.desc:0 "$uba_decisions.2000.desc$"
 uba_decisions.9000.yurt:0 "……与我相称的王庭。"
 uba_decisions.9000.yurt.flavor:0 "你考虑建设一座$building_type_UBA_yurt_01$"
 uba_decisions.9000.pasture:0 "……水草丰美的牧场。"
 uba_decisions.9000.pasture.flavor:0 "你考虑建设一座$building_type_UBA_pasture_01$"
 uba_decisions.9000.hunting:0 "$uba_decisions.8000.hunting$"
 uba_decisions.9000.hunting.flavor:0 "$uba_decisions.8000.hunting.flavor$"
 uba_decisions.9100.t:0 "建筑规划：$building_type_UBA_yurt_01$"
 uba_decisions.9100.desc:0 "我将建立起一座与我相称的王庭，成为大草原上无可争议的权力中心。\n\n我的军令将自此而出，让草原上的每个部族、不论是我的奴仆还是我的敌人，都匍匐在我脚下。"
 uba_decisions.9100.a:0 "$uba_decisions.1100.a$"
 uba_decisions.9100.a_tt:0 "$uba_decisions.2100.a_tt$"
 uba_decisions.9200.t:0 "建筑规划：$building_type_UBA_pasture_01$"
 uba_decisions.9200.desc:0 "我将划定一片水草丰美的牧场，让我们的牲畜——山羊、绵羊、马、骆驼和牛在草原上自由奔跑。\n\n通过更好的放牧方式和更完善的管理，我将拥有规模更大的牧群……"
 uba_decisions.9200.a:0 "$uba_decisions.1100.a$"
 uba_decisions.9200.a_tt:0 "$uba_decisions.2100.a_tt$"

# Vassalyn的事件
 uba_vassalyn.1000.t:0 "一桩交易：成还是不成？"
 uba_vassalyn.1000.desc:0 "我的柜子在动！\n\n我仿佛能听见自己心脏剧烈跳动的声音。那是什么？刺客吗。\n\n正当我准备大声呼救的时候，柜子里传来了一个陌生而充满诱惑的声音：\n\n“亲爱的[ROOT.GetCharacter.GetFirstNameNoTooltip]，你想要#EMP [gold|E]#!，对吧？我可以给你任何你想要的东西，只要你愿意将桌上的那袋金币给我，再加上一点点灵魂……”\n\n真该死，那难道是什么柜子里的魔鬼吗，我真的该和一个不知底细的家伙做交易吗？"
 uba_vassalyn.1000.a:0 "你要什么我就给什么！"
 uba_vassalyn.1000.a.flavor:0 "“只需要把金币袋子放在那里就行了，至于灵魂，我之后自会来取走的。”那个声音回答道。"
 uba_vassalyn.1000.back:0 "我才不会和恶魔交易，滚回去！"
 uba_vassalyn.1000.back.flavor:0 "那个声音随即消失了。赶来的侍卫为你检查了柜子，然而什么都没有发现。"
 uba_vassalyn.1000.cancel:0 "这一定是幻觉！"
 uba_vassalyn.1000.cancel.flavor:0 "你无视了奇怪的声音，但显然这是不祥之兆。"

 uba_vassalyn.1001.t:0 "一桩交易：柜子里的声音"
 uba_vassalyn.1001.desc:0 "“成交，”那个声音说，“不必想着反悔，我能给你的东西绝对超过这袋金币的价值。”\n\n“比如说，一座采之不尽的矿藏。”\n\n一座矿？多么愚蠢的想法。要是它真的存在，早就该被之前的人们发现了。\n\n“随你信不信。但你必须做出选择，是要宝石，还是选择金属——顺便一提，我还会收取一点点手续费……别担心，只是一点点灵魂而已，真的只是一点点哦！”"
 uba_vassalyn.1001.again:0 "“还不错，不是吗？”\n\n“你想要什么？是要宝石，还是选择金属——顺便一提，手续费还是需要支付的……别担心，只是一点点灵魂而已，真的只是一点点哦！”"
 uba_vassalyn.1001.a:0 "#EMP 宝石#!矿脉可远比一袋金币要值钱。" 
 uba_vassalyn.1001.a.flavor:0 "“哦？人类果然就喜欢亮闪闪的东西……”她似乎知道我在想什么"
 uba_vassalyn.1001.b:0 "若我能拥有一座#EMP 金属#!矿产……" 
 uba_vassalyn.1001.b.flavor:0 "“比如说，金子？哈哈哈——”那个声音笑得有些瘆人"
 uba_vassalyn.1001.c:0 "我全都要！" 
 uba_vassalyn.1001.c.flavor:0 "“在我面前卖弄小聪明，这可不是什么好主意。”"
 uba_vassalyn.1001.back:0 "不对，我不会和魔鬼做交易！卫兵！"
 uba_vassalyn.1001.back.flavor:0 "那个声音叹了口气，随即消失了。赶来的侍卫为你检查了柜子，然而什么都没有发现。"
 uba_vassalyn.1001.cancel:0 "不对，这一定是幻觉……"
 uba_vassalyn.1001.cancel.flavor:0 "$uba_vassalyn.1000.cancel.flavor$"

 uba_vassalyn.1100.t:0 "一桩交易：宝石？"
 uba_vassalyn.1100.desc:0 "是啊，如果我能有采之不尽，用之不竭的宝石的话，我就能用它们做许多事。一颗漂亮的宝石足够让任何平民为我献上忠诚，让我的侍从与士兵欢欣鼓舞。想象一下，我甚至可以用宝石从头到脚装饰我的城堡……\n\n我正准备开口时，一位冒失的侍从猛地打开了房门，打断了我。在我开口斥责他之前，他就开口道：\n\n“大人，我们刚刚发现了……”\n\n此刻你无心去听你的侍从在说什么，因为那声音正在对你说："
 uba_vassalyn.1100.a:0 "“#EMP 宝石#!想必是你的最爱吧～”"
 uba_vassalyn.1100.a.flavor:0 "你后来在侍从口中得到了一样的回答，而桌上的金币不知何时消失得无影无踪。\n\n显然，那位魔鬼已经收走了你的报价。但用一小袋金币和一点灵魂换来无尽的宝石，这种好事恐怕#color_gray 不会再有了#!。"
 uba_vassalyn.1100.b:0 "“我知道，你喜欢#EMP 钻石#!！”"
 uba_vassalyn.1100.b.flavor:0 "你后来在侍从口中得到了一样的回答，而桌上的金币不知何时消失得无影无踪。\n\n显然，那位魔鬼已经收走了你的报价。但用一小袋金币和一点灵魂换来无尽的钻石，这种好事恐怕#color_gray 不会再有了#!。”"
 uba_vassalyn.1100.c:0 "“或许你更喜欢#EMP 玉石#!？”"
 uba_vassalyn.1100.c.flavor:0 "$uba_vassalyn.1200.a.flavor$"
 uba_vassalyn.1100.d:0 "“换成#EMP 食盐#!，怎么样？”"
 uba_vassalyn.1100.d.flavor:0 "$uba_vassalyn.1200.a.flavor$"
 uba_vassalyn.1100.z:0 "“嘿，醒一醒！”"
 uba_vassalyn.1100.z.flavor:0 "那个声音将你从幻觉中拉回了现实。"

 uba_vassalyn.1200.t:0 "一桩交易：金属？"
 uba_vassalyn.1200.desc:0 "是啊，美妙的金属。如果我拥有一座金矿或是银矿，我将变得无比富有；如果我拥有一座铁矿或是铜矿，我将能用最优质的金属来打造武器……\n\n我正准备开口时，一位冒失的侍从猛地打开了房门，打断了我。在我开口斥责他之前，他就开口道：\n\n“大人，我们刚刚发现了……”\n\n此刻你无心去听你的侍从在说什么，因为那声音正在对你说："
 uba_vassalyn.1200.a:0 "“那是一座#EMP 金矿#!。”"
 uba_vassalyn.1200.a.flavor:0 "你后来在侍从口中得到了一样的回答。你注意到桌上的金币不知何时不见了，某些东西也随着消失得无影无踪。\n\n显然，那位魔鬼已经收走了你的报价。"
 uba_vassalyn.1200.b:0 "“我猜你会更喜欢#EMP 银矿#!。”"
 uba_vassalyn.1200.b.flavor:0 "$uba_vassalyn.1200.a.flavor$"
 uba_vassalyn.1200.c:0 "“你大概会更需要#EMP 铜矿#!。”"
 uba_vassalyn.1200.c.flavor:0 "$uba_vassalyn.1200.a.flavor$"
 uba_vassalyn.1200.d:0 "“这座#EMP 铁矿#!足以让你满足。”"
 uba_vassalyn.1200.d.flavor:0 "$uba_vassalyn.1200.a.flavor$\n\n但那位小恶魔留下了一张奇怪的纸条：“这将会解锁$building_type_wind_furnace_01$线[buildings|E]”——你不知道这是什么意思。"
 uba_vassalyn.1200.z:0 "$uba_vassalyn.1100.z$"
 uba_vassalyn.1200.z.flavor:0 "$uba_vassalyn.1100.z.flavor$"

 uba_vassalyn.1900.t:0 "一桩交易：贪婪的选择"
 uba_vassalyn.1900.desc:0 "“唉。”那个声音很明显叹了口气。“这就是你的选择吗？贪婪的人类啊，我不得不提醒你，你的金子并不足以买到这种愿望。”\n\n“当然，如果你非要选这个不可的话，我将不得不收走更多#EMP 代价#!，选择权在你，我亲爱的[ROOT.GetCharacter.GetFirstNameNoTooltip]。”"
 uba_vassalyn.1900.a:0 "“我同意。”"
 uba_vassalyn.1900.a.flavor:0 "“那么，如你所愿。”那个声音回答道。"
 uba_vassalyn.1900.z:0 "“我想了想，还是算了。”"
 uba_vassalyn.1900.z.flavor:0 "“很好。”那个声音回答道。"

 uba_vassalyn.1901.t:0 "一桩交易：奇迹？"
 uba_vassalyn.1901.desc:0 "我正准备开口时，一位冒失的侍从猛地打开了房门，打断了我。在我开口斥责他之前，他就开口道：\n\n“大人，我们刚刚发现了……”\n\n此刻你无心去听你的侍从在说什么，因为那声音正在对你说："
 uba_vassalyn.1901.a:0 "“那是一座#EMP 奇迹#!般的矿脉。”"
 uba_vassalyn.1901.a.flavor:0 "你后来在侍从口中得知，他们发现了一处高质量的铁矿，而桌上的金币不知何时不见了，某些东西也随着消失得无影无踪。还留下了一张奇怪的纸条：“这将会解锁$building_type_wind_furnace_01$线[buildings|E]”——这是什么意思？但显然，那位魔鬼已经收走了你的报价。"
 uba_vassalyn.1901.b:0 "“现在反悔可来不及了。”"
 uba_vassalyn.1901.b.flavor:0 "$uba_vassalyn.1901.a.flavor$"

 uba_vassalyn.1902.t:0 "一桩交易：奇迹的代价"
 uba_vassalyn.1902.desc:0 "几天之后，我发现每个看到我的人都会不自觉地发笑。而当我问及原因时，他们都开始尝试转移话题，或者以各种方式回避作答。（而且还在笑！）\n\n最终，一位忠心耿耿的侍从终于愿意回答我的问题了，他说：\n\n“大人，现在到处都在流传一个您试图对一只魅魔求爱，最终却被魅魔踢下床的故事……而且这类故事还不止一个，连领地里的农民们都能说出好几个不同的版本，更不用说……”\n\n我的侍从还在继续说明，但我已经没有勇气听下去了。"
 uba_vassalyn.1902.a:0 "该死！"
 uba_vassalyn.1902.a.flavor:0 "你现在知道了那小小的代价究竟是什么……"
