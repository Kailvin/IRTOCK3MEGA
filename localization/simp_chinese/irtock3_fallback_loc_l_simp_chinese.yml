 irtock3_roman_events.1.desc.vassal: "Despite being given the opportunity to rule over such a prestigious realm, the efforts of [roman_emperor.GetNameNoTooltip] and [roman_emperor.GetHerHis] predecessors doesn't seem to have been enough to prevent our decline. Whether it be barbarians chipping away at our borders, or internal strife weakening us from within, it seems that our glory days are behind us.\n\nThere are many ambitious rulers, both within our borders, and outside it. Will someone seize this opportunity to try and return Rome to it's former glory, or will they try to extinguish this last remnant of the civilized world?"
