l_simp_chinese:
uba_greeting.0001.t: "建筑师行会"
uba_greeting.0001.desc.noblesopenning: "一位身披斗篷的来访者悄然走进了我的书房，对我微微欠身。\n\n这位神秘来客用平稳的声音开口：“不必惊讶，尊贵的[ROOT.Char.GetTitleAsNameNoTooltip]，我只是为您带来建筑师行会的问候……”\n\n"
uba_greeting.0001.desc.wanderersopenning: "当我在角落里独自享受着饮品与片刻闲适时，一个身披斗篷的影子在我身侧坐下。\n\n这位神秘来客用平稳的声音开口：“不必惊讶，我的[ROOT.Char.GetTitleAsNameNoTooltip]，我只是为您带来建筑师行会的问候……”\n\n"
uba_greeting.0001.desc.modlist: "这位使者停顿了一下，“目前已有以下内容准备就绪，供您使用："
uba_greeting.0001.desc.uba: "#high 奇观建筑师 #!"
uba_greeting.0001.desc.uba: "#high 奇观建筑师 #!"
uba_greeting.0001.desc.ubahbp: "#high 奇观建筑师：亚洲特建包 #!"
uba_greeting.0001.desc.rba: "#high 王国建筑师 #!"
uba_greeting.0001.desc.hba: "#high 地产建筑师 #!"
uba_greeting.0001.desc.eba: "#high 庄园建筑师 #!"
uba_greeting.0001.desc.aba: "#high 自动建筑师 #!"
uba_greeting.0001.desc.ending: "！”\n\n使者看着你的眼睛：“建筑师行会有一份老主顾名单。希望有朝一日，您的名字也能位列其中——您对此感兴趣吗？”"
uba_greeting.0001.a: "“已经足够了，谢谢你。”"
uba_greeting.0001.a_tt: "你只是眨了眨眼，使者便从你眼前消失了，就像未曾来过一样。"
uba_greeting.0001.thanks: "“或许吧，让我看看那份名单。”"
uba_greeting.0001.thanks_tt: "使者拿出了一份有些泛黄的卷轴。"
uba_greeting.0002.t: "行会的老主顾"
uba_greeting.0002.desc.openning: "使者的眼里似乎闪烁着光：“感谢每一位行会的老主顾，不管他们是否提供了物质支持——”\n\n"
uba_greeting.0002.desc.ending: "以上诸位为建筑师行会提供的大力支持。”\n\n“另外，还要感谢您，尊贵的[ROOT.Char.GetTitleAsNameNoTooltip]，您的支持将会是我们前进的动力。”\n\n我还想开口说些什么，这位神秘的来客却已经消失了，只留下了一小袋钱币与一张纸条。"
uba_greeting.0002.a: "一次奇遇。"
uba_greeting.0002.a_tt: "“感谢你，亲爱的玩家。”"
uba_greeting.0002.desc.thanks: "“感谢：\nDCDAA\n云纪\n郁梓涵\n木易\n饺子\n住已\nBloodlineCain\nsunny\n爱发电用户_2926a\n叶铭\n爱发电用户_hvy6\n染上漆黑色的指挥官\n是什么造就了一只猪\n爱发电用户_wHgQ\nEvilCrayfish\n"
